let _notifications = [];
let _notifLoaded = false;

async function loadNotifications(){
  if(!fbDb||!currentUser) return;
  try{
    const snap=await fbDb.collection(`users/${currentUser.uid}/notifications`).where('status','==','pending').limit(30).get();
    _notifications=snap.docs.map(d=>({_id:d.id,...d.data()}));
    _notifLoaded=true; renderNav();
    if(current==='friends') render();
  }catch(e){ console.error('loadNotifications:',e); }
}

async function syncSharedRoutines(){
  if(!fbDb||!currentUser) return;
  const shared=DB.routines.filter(r=>r.isShared&&r.sharedId);
  if(!shared.length) return;
  let changed=false;
  for(const r of shared){
    try{
      const snap=await fbDb.doc(`sharedRoutines/${r.sharedId}`).get();
      if(!snap.exists) continue;
      const data=snap.data();
      r.sharedMembers=data.members||[];
      r.sharedPending=data.pendingInvites||[];
      const completions=data.completions||{};
      const members=data.members||[];
      if(!r.sharedCompletions) r.sharedCompletions={};
      Object.entries(completions).forEach(([ds,dayMap])=>{
        r.sharedCompletions[ds]=dayMap;
        const myDone=!!dayMap[currentUser.uid];
        const allDone=members.length>1&&members.every(m=>!!dayMap[m.uid]);
        if(allDone) r.history[ds]='done';
        else if(myDone&&members.length>1) r.history[ds]='partial';
        else if(myDone) r.history[ds]='done';
      });
      changed=true;
    }catch(e){}
  }
  if(changed){ save(); if(current==='routines') render(); }
}

async function markSharedComplete(r){
  if(!fbDb||!currentUser||!r.sharedId) return;
  const today=todayStr();
  try{
    await fbDb.doc(`sharedRoutines/${r.sharedId}`).update({[`completions.${today}.${currentUser.uid}`]:true});
    const snap=await fbDb.doc(`sharedRoutines/${r.sharedId}`).get();
    if(!snap.exists) return;
    const data=snap.data();
    const todayMap=data.completions?.[today]||{};
    if(!r.sharedCompletions) r.sharedCompletions={};
    r.sharedCompletions[today]=todayMap;
    const members=data.members||[];
    const allDone=members.length>1&&members.every(m=>!!todayMap[m.uid]);
    if(allDone){
      r.history[today]='done'; save(); render();
      burst(document.querySelector(`[data-routine-toggle="${r.id}"]`)||document.body);
      toast('🎉 Everyone completed it!');
    } else {
      r.history[today]='partial';
      const waiting=members.filter(m=>!todayMap[m.uid]&&m.uid!==currentUser.uid).map(m=>m.username.split(' ')[0]);
      save(); render();
      if(waiting.length) toast(`✓ Your turn done! Waiting for ${waiting.slice(0,2).join(', ')}…`);
    }
  }catch(e){ console.error('markSharedComplete:',e); r.history[today]='done'; save(); render(); }
}

async function sendRoutineInvites(sharedId,title,schedule,icon,friends){
  if(!fbDb||!currentUser||!friends.length) return;
  const myName=friendsCache.me?.username||currentUser.displayName||'Someone';
  const batch=fbDb.batch();
  friends.forEach(f=>{
    const ref=fbDb.collection(`users/${f.uid}/notifications`).doc();
    batch.set(ref,{type:'routine-invite',sharedId,routineTitle:title,routineIcon:icon||'spark',routineSchedule:schedule,fromUid:currentUser.uid,fromName:myName,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  });
  await batch.commit();
}

async function acceptRoutineInvite(notif){
  if(!fbDb||!currentUser||!notif.sharedId){toast('Something went wrong');return;}
  try{
    const snap=await fbDb.doc(`sharedRoutines/${notif.sharedId}`).get();
    if(!snap.exists){toast('Routine no longer exists');return;}
    const data=snap.data();
    if(data.members?.find(m=>m.uid===currentUser.uid)){toast('Already in this routine!');_notifications=_notifications.filter(n=>n._id!==notif._id);renderNav();closeModal();return;}
    const myName=friendsCache.me?.username||currentUser.displayName||'Friend';
    const newMember={uid:currentUser.uid,username:myName,joinedAt:Date.now()};
    const routine={id:uid(),title:data.title,icon:data.icon||'spark',schedule:data.schedule,history:{},order:DB.routines.length,createdAt:Date.now(),isShared:true,sharedId:notif.sharedId,sharedMembers:[...(data.members||[]),newMember],sharedPending:(data.pendingInvites||[]).filter(p=>p.uid!==currentUser.uid),sharedCompletions:{}};
    DB.routines.push(routine);
    const meInPending=data.pendingInvites?.find(p=>p.uid===currentUser.uid);
    const batch=fbDb.batch();
    batch.update(fbDb.doc(`sharedRoutines/${notif.sharedId}`),{members:firebase.firestore.FieldValue.arrayUnion(newMember),...(meInPending?{pendingInvites:firebase.firestore.FieldValue.arrayRemove(meInPending)}:{})});
    batch.update(fbDb.doc(`users/${currentUser.uid}/notifications/${notif._id}`),{status:'accepted'});
    await batch.commit();
    _notifications=_notifications.filter(n=>n._id!==notif._id);
    await syncSharedRoutines();
    save(); renderNav(); closeModal(); render();
    toast(`Joined "${data.title}"! 🎉`);
  }catch(e){console.error('acceptRoutineInvite:',e);toast('Error joining — try again');}
}

async function declineRoutineInvite(notif){
  if(!fbDb||!currentUser) return;
  try{
    await fbDb.doc(`users/${currentUser.uid}/notifications/${notif._id}`).update({status:'declined'});
    if(notif.sharedId){
      const snap=await fbDb.doc(`sharedRoutines/${notif.sharedId}`).get();
      if(snap.exists){const me=snap.data().pendingInvites?.find(p=>p.uid===currentUser.uid);if(me) await fbDb.doc(`sharedRoutines/${notif.sharedId}`).update({pendingInvites:firebase.firestore.FieldValue.arrayRemove(me)});}
    }
  }catch(e){}
}

let toastT; function toast(msg){ let el=document.getElementById('toast'); if(!el){el=document.createElement('div');el.id='toast';el.className='fixed left-1/2 -translate-x-1/2 bottom-28 md:bottom-10 z-[60] px-4 py-2.5 rounded-xl text-sm font-semibold';el.style.cssText+='background:var(--bg2);border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.3)';document.body.appendChild(el);} el.textContent=msg; el.style.opacity='1'; clearTimeout(toastT); toastT=setTimeout(()=>el.style.opacity='0',1800); }

document.addEventListener('click',e=>{
  if(window._swSuppress && Date.now()-window._swSuppress<160) return; // ignore click right after a swipe
  const el=e.target.closest('[data-nav],[data-act],[data-routine-toggle],[data-routine-edit],[data-routine-del],[data-routine-excuse],[data-routine-up],[data-routine-down],[data-streak-cal],[data-task-toggle],[data-task-del],[data-task-purge],[data-task-restore],[data-clear-deleted],[data-clear-completed],[data-open-task],[data-pomo],[data-open-countdown],[data-countdown-del],[data-shoptab],[data-shop-toggle],[data-shop-restore],[data-shop-move],[data-shop-del],[data-clear-bought],[data-clear-deleted-shop],[data-open-countdown],[data-energy],[data-tview],[data-shoptab],[data-close],[data-nudge],[data-friend-uid]');
  if(!el)return; const d=el.dataset;
  if(d.close!==undefined) return closeModal();
  if(d.nav) return go(d.nav);
  if(d.tview){ taskView=d.tview; return render(); }
  if(d.shoptab){ shopTab=d.shoptab; return render(); }
  // routines
  if(d.routineToggle){
    const r=DB.routines.find(x=>x.id===d.routineToggle); if(!r) return render();
    const today=todayStr(), hs=r.history[today];
    const isDone=hs==='done', isPartial=hs==='partial';
    const bonusDone=isDone&&!scheduledOn(r,new Date()); if(bonusDone) return;
    if(!isDone&&!isPartial){
      if(r.isShared&&(r.sharedMembers||[]).length>1&&FB_READY&&currentUser){
        r.history[today]='partial';
        if(!r.sharedCompletions) r.sharedCompletions={};
        r.sharedCompletions[today]={...(r.sharedCompletions[today]||{}),[currentUser.uid]:true};
        save(); render(); markSharedComplete(r); return;
      }
      setRoutineState(r,'done');
      if(!scheduledOn(r,new Date())) bonusBurst(el); else if(!celebrateMilestone(r)) burst(el);
    } else {
      if(isPartial&&r.isShared&&FB_READY&&currentUser&&r.sharedId){
        fbDb?.doc(`sharedRoutines/${r.sharedId}`)?.update({[`completions.${today}.${currentUser.uid}`]:firebase.firestore.FieldValue.delete()}).catch(()=>{});
        if(r.sharedCompletions?.[today]) delete r.sharedCompletions[today][currentUser.uid];
      }
      setRoutineState(r,'none');
    }
    return render();
  }
  if(d.routineExcuse){ const r=DB.routines.find(x=>x.id===d.routineExcuse); const wasExcused=r.history[todayStr()]==='excuse'; setRoutineState(r, wasExcused?'none':'excuse'); return render(); }
  if(d.routineUp||d.routineDown){
    const id=d.routineUp||d.routineDown, dir=d.routineUp?-1:1;
    const r=DB.routines.find(x=>x.id===id); if(!r) return render();
    const myRank=routineRank(r);
    const sorted=[...DB.routines].sort((a,b)=>{ const ra=routineRank(a),rb=routineRank(b); return ra!==rb?ra-rb:(a.order??0)-(b.order??0); });
    const group=sorted.filter(x=>routineRank(x)===myRank);
    const idx=group.findIndex(x=>x.id===id);
    const si=idx+dir; if(si<0||si>=group.length) return render();
    const other=group[si];
    if(r.order===undefined) r.order=idx;
    if(other.order===undefined) other.order=si;
    const tmp=r.order; r.order=other.order; other.order=tmp;
    save(); _reorderRoutinesInPlace(id, d.routineUp?'rd-moved-up':'rd-moved-dn'); return;
  }

  if(d.streakCal) return streakCalendarModal(d.streakCal);
  if(d.routineEdit){ const r=DB.routines.find(x=>x.id===d.routineEdit); if(!r) return; if(r.isShared){ if(friendsCache.ts===0&&FB_READY&&currentUser) loadFriendsData().then(()=>sharedRoutineModal(r)); else sharedRoutineModal(r); } else routineModal(r); return; }
  if(d.routineDel){ DB.routines=DB.routines.filter(x=>x.id!==d.routineDel); save(); closeModal(); return render(); }

/* helper: returns context-aware swipe labels/colors for the current item state */
function swipeDynamic(kind, id, dir){
  if(kind==='task'){
    const t=DB.tasks.find(x=>x.id===id);
    if(t && t.done){
      if(dir==='right') return { label:'', color:'var(--surface2)', blocked:true };
      if(dir==='left')  return { label:'↩ Undo', color:'#5B8EC8' };
    }
  }
  return dir==='right' ? SWIPE[kind].right : SWIPE[kind].left;
}
let swipe=null;
document.addEventListener('pointerdown',e=>{
  const fg=e.target.closest('[data-swipe-fg]');
  if(!fg) return;
  if(e.target.closest('[data-routine-edit],[data-shop-toggle],[data-shop-move],[data-shop-del],[data-task-toggle],[data-pomo],a')) return;

document.addEventListener('pointermove',e=>{

  if(!swipe.active){
    if(Math.abs(dx)<5) return;
    if(Math.abs(dy)>Math.abs(dx)*1.2){ swipe=null; return; }
    swipe.active=true; swipe.fg.style.transition='none';
  }
  e.preventDefault();
  swipe.dx=dx; swipe.fg.style.transform=`translateX(${dx}px)`;

  } else if(swipe.kind==='routine'){
    // two-stage: excuse (0-70px, blue) → skip (140px+, orange) with smooth lerp between
    const absX=Math.abs(dx), EXCUSE_T=70, SKIP_T=140;
    let bgColor, label;
    if(absX>=SKIP_T){
      bgColor='var(--danger)'; label='Miss';
    } else if(absX>=EXCUSE_T){
      const t=(absX-EXCUSE_T)/(SKIP_T-EXCUSE_T);
      bgColor=lerpColor('#7B9EC8','#FF5C72',t); label=t>0.5?'Miss':'Excuse';
    } else {
      bgColor='#7B9EC8'; label='Excuse';
    }
    b.style.opacity=String(Math.min(1,absX/EXCUSE_T));
    b.style.justifyContent='flex-end'; b.style.background=bgColor;
    b.style.color='#fff';
    b.innerHTML=`<span>${absX>=EXCUSE_T?'':'← '}${label}</span>`;
  } else {
    const c=swipeDynamic(swipe.kind,swipe.id,'left');
    b.style.opacity='1'; b.style.justifyContent='flex-end';
    b.style.background=c.color; b.style.color='var(--accent-ink)';
    b.innerHTML=`<span>${reached?'':'← '}${c.label}</span>`;
  }
});
function _swipeFinish(e){
  if(!swipe) return; const s=swipe; swipe=null;
  const finalDx = s.active ? s.dx : (e.clientX - s.startX);
  const finalDy = Math.abs(e.clientY - s.startY);
  if(Math.abs(finalDx)<5 || (finalDy>Math.abs(finalDx)*1.8 && !s.active)){
    s.fg.style.transition='transform .22s ease'; s.fg.style.transform='translateX(0)';
    if(s.bg) s.bg.style.opacity='0'; return;
  }
  window._swSuppress=Date.now();
  if(Math.abs(finalDx)>70) haptic(12);
  const cfg=SWIPE[s.kind];
  s.fg.style.transition='transform .22s ease';
  const THRESH=70, SKIP_T=140;
  if(finalDx>THRESH){
    const dyn=swipeDynamic(s.kind,s.id,'right');
    if(dyn.blocked){ s.fg.style.transform='translateX(0)'; if(s.bg) s.bg.style.opacity='0'; return; }
    s.fg.style.transform='translateX(110%)'; setTimeout(()=>{ cfg.onRight(s.id); render(); },190);
  } else if(finalDx<-THRESH){
    s.fg.style.transform='translateX(-110%)';
    if(s.kind==='routine' && finalDx>-SKIP_T){
      // short left swipe = excuse
      setTimeout(()=>{ const r=DB.routines.find(x=>x.id===s.id); if(r) setRoutineState(r,'excuse'); render(); },190);
    } else {
      // long left swipe (or non-routine) = normal left action (skip / delete)
      setTimeout(()=>{ cfg.onLeft(s.id); render(); },190);
    }
  } else {
    s.fg.style.transform='translateX(0)'; if(s.bg) s.bg.style.opacity='0';
  }
}

/* ============================================================
   === LONG PRESS === (hold a shopping card to edit it)
   A teal ring grows around the card over 500 ms so the user
   can see it charging. Release early to cancel.
============================================================ */
let longPress=null;
document.addEventListener('pointerdown',e=>{
  const card=e.target.closest('[data-shop-card]');
  if(!card) return;
  if(e.target.closest('[data-shop-toggle],[data-shop-move],[data-shop-del],a')) return;

  const id=card.dataset.shopCard;
  const startTime=Date.now();
  const DURATION=520;
  let raf=null;

  function tick(){
    const progress=Math.min(1,(Date.now()-startTime)/DURATION);
    // build a growing teal ring: 0 → 4px spread, opacity 0 → 0.9
    const spread=(progress*4).toFixed(1);
    const alpha=(progress*0.9).toFixed(2);
    card.style.boxShadow=`0 0 0 ${spread}px rgba(21,154,119,${alpha})`;

    if(progress<1){
      raf=requestAnimationFrame(tick);
    } else {
      // hold complete — flash the ring, tiny squeeze, then open modal
      haptic(18);
      card.style.boxShadow='0 0 0 4px rgba(21,154,119,0.9)';
      card.style.transform='scale(0.97)';
      card.style.transition='transform .1s ease';
      window._swSuppress=Date.now();
      setTimeout(()=>{
        card.style.boxShadow='';
        card.style.transform='';
        card.style.transition='';
        longPress=null;
        const item=DB.shopping.find(x=>x.id===id);
        if(item) shopModal(item);
      },120);
    }
  }

  raf=requestAnimationFrame(tick);
  longPress={ cancel(){ cancelAnimationFrame(raf); card.style.boxShadow=''; card.style.transform=''; card.style.transition=''; } };
});

function _rdFinish(){
  if(!rdDragId) return;
  const wasDragging=rdDragging;
  const movedId=rdDragId;
  if(wasDragging&&rdOverId){
    const a=DB.routines.find(x=>x.id===rdDragId),b=DB.routines.find(x=>x.id===rdOverId);
    if(a&&b&&routineRank(a)===routineRank(b)){const tmp=a.order;a.order=b.order;b.order=tmp;save();}
  }
  if(rdGhost) rdGhost.remove();
  rdGhost=null;
  document.querySelectorAll('.routine-row.drop-hint').forEach(x=>x.classList.remove('drop-hint'));
  if(rdSrcEl) rdSrcEl.style.opacity='';
  rdDragId=null;rdOverId=null;rdSrcEl=null;rdDragging=false;rdPid=null;
  if(wasDragging){window._swSuppress=Date.now();_reorderRoutinesInPlace(movedId,'rd-placed');}
}
document.addEventListener('pointerup',_rdFinish);
document.addEventListener('pointercancel',e=>{_rdFinish();});
document.addEventListener('dragstart',e=>{ const tc=e.target.closest('[data-task-card]'); const sc=e.target.closest('[data-shop-card]');
  if(tc){dragId=tc.dataset.taskCard;dragType='task';tc.classList.add('dragging');}
  else if(sc){dragId=sc.dataset.shopCard;dragType='shop';sc.classList.add('dragging');} });
document.addEventListener('dragend',e=>{ document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging')); document.querySelectorAll('.drop-hint').forEach(x=>x.classList.remove('drop-hint')); });
document.addEventListener('dragover',e=>{
  if(dragType==='task'){ const over=e.target.closest('[data-task-card]'); if(over&&over.dataset.taskCard!==dragId){e.preventDefault();} }
  if(dragType==='shop'){ const list=e.target.closest('[data-droplist]'); if(list){e.preventDefault();} }
});
document.addEventListener('drop',e=>{
  if(dragType==='task'){ const over=e.target.closest('[data-task-card]'); if(over&&over.dataset.taskCard!==dragId){
    const from=DB.tasks.findIndex(t=>t.id===dragId); const to=DB.tasks.findIndex(t=>t.id===over.dataset.taskCard);
    const [m]=DB.tasks.splice(from,1); DB.tasks.splice(to,0,m); taskSort='manual'; DB.settings.taskSort='manual'; save();
    sorterManual=true; render(); } }
  if(dragType==='shop'){ const list=e.target.closest('[data-droplist]'); if(list){
    const item=DB.shopping.find(s=>s.id===dragId); if(item){ item.list=list.dataset.droplist; save(); render(); } } }
  dragId=null;dragType=null;
});
let sorterManual=false;

let focusState=null;
function openFocusSetup(taskId){
  const task = taskId?DB.tasks.find(t=>t.id===taskId):null;
  openModal(`
  <div class="flex items-center justify-between mb-1">
    <h3 class="font-display font-bold text-xl">Focus session</h3>
    <button data-close class="muted text-xl">✕</button>
  </div>
  <p class="muted text-sm mb-4">${task?('On: '+esc(task.title)):'Free focus session'}</p>
  <div class="chip p-1 flex text-sm font-semibold mb-2">
    <button type="button" data-mode="focus" class="flex-1 py-2 rounded-full">Focus</button>
    <button type="button" data-mode="hardcore" class="flex-1 py-2 rounded-full">Hardcore</button>
    <button type="button" data-mode="stopwatch" class="flex-1 py-2 rounded-full">Stopwatch</button>
  </div>
  <div id="modeDesc" class="text-xs muted mb-4"></div>
  <div id="durSection">
    <div class="text-xs muted mb-1.5">Length</div>
    <div class="grid grid-cols-4 gap-2 mb-3">
      ${[10,30,60].map(m=>`<button type="button" data-dur="${m}" class="dur-btn py-3 rounded-xl text-sm font-bold" style="background:var(--surface2)">${m}<span class="text-[10px] font-normal block muted">min</span></button>`).join('')}
      <button type="button" data-dur="custom" class="dur-btn py-3 rounded-xl text-sm font-bold" style="background:var(--surface2)">Custom</button>
    </div>
    <div id="wheelWrap" style="display:none" class="mb-3">
      <div class="relative">
        <div style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:44px;border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);pointer-events:none;opacity:.6"></div>
        <div class="mwheel" id="mwheel"><div class="mw-pad"></div>${Array.from({length:180},(_,i)=>`<div class="mw-item" data-min="${i+1}">${i+1}</div>`).join('')}<div class="mw-pad"></div></div>
      </div>
      <div class="text-center text-xs muted -mt-1">scroll to set minutes</div>
    </div>
  </div>
  <button id="flStart" class="btn btn-accent w-full py-3.5 font-display font-bold text-base">Start session</button>
  `);
  let mode='focus', dur=30, customMin=25;
  const m=document.getElementById('modal');
  const modeDesc=m.querySelector('#modeDesc');
  const durSection=m.querySelector('#durSection');
  const wheel=m.querySelector('#mwheel');
  const startBtn=m.querySelector('#flStart');
  const DESCS={focus:'Full-screen timer you can end whenever you like.',hardcore:'Full-screen lockdown — you must hold to exit. No easy escape.',stopwatch:'Tap start, work freely at your own pace, tap stop when you\'re done.'};
  const paintMode=()=>{ m.querySelectorAll('[data-mode]').forEach(b=>{ const on=b.dataset.mode===mode,isHard=b.dataset.mode==='hardcore'; b.style.boxShadow=on?(isHard?'0 0 0 2px var(--danger)':'0 0 0 2px #fff'):'none'; b.style.background=on&&isHard?'color-mix(in srgb,var(--danger) 18%,transparent)':''; b.style.color=on&&isHard?'var(--danger)':''; }); modeDesc.style.color=mode==='hardcore'?'var(--danger)':''; modeDesc.textContent=DESCS[mode]; durSection.style.display=mode==='stopwatch'?'none':'block'; startBtn.textContent=mode==='stopwatch'?'Start stopwatch':mode==='hardcore'?'Enter Hardcore':'Start session'; };
  const paintDur=()=>{ m.querySelectorAll('.dur-btn').forEach(b=>{ const on=(b.dataset.dur==='custom')?dur==='custom':+b.dataset.dur===dur; b.style.boxShadow=on?'0 0 0 2px #fff':'none'; }); m.querySelector('#wheelWrap').style.display=dur==='custom'?'block':'none'; };
  const highlight=()=>{ const idx=Math.round(wheel.scrollTop/44); customMin=Math.max(1,Math.min(180,idx+1)); wheel.querySelectorAll('.mw-item').forEach((it,i)=>it.classList.toggle('sel',i===idx)); };
  paintMode(); paintDur();
  m.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; paintMode(); });
  m.querySelectorAll('[data-dur]').forEach(b=>b.onclick=()=>{ dur=b.dataset.dur==='custom'?'custom':+b.dataset.dur; paintDur(); if(dur==='custom'){ requestAnimationFrame(()=>{ wheel.scrollTop=(customMin-1)*44; highlight(); }); } });
  wheel.addEventListener('scroll',highlight);
  startBtn.onclick=()=>{ const minutes=mode==='stopwatch'?0:(dur==='custom'?customMin:dur); closeModal(); startFocusLock(taskId||null,minutes,mode); };
}
function startFocusLock(taskId,minutes,mode){
  const task=taskId?DB.tasks.find(t=>t.id===taskId):null;
  const stopwatch=mode==='stopwatch', hardcore=mode==='hardcore';
  focusState={task,totalSecs:minutes*60,elapsed:0,hardcore,stopwatch};
  document.getElementById('flTask').textContent=task?task.title:'Free focus session';
  document.getElementById('flTag').textContent=task?(task.tags||[]).join(' · '):'';
  document.getElementById('flSessionBadge').textContent=stopwatch?'Stopwatch':`${hardcore?'Hardcore':'Focus'} · ${minutes} min`;
  document.getElementById('flDone').style.display='none';
  document.getElementById('flProgress').style.visibility=stopwatch?'hidden':'visible';
  const btn=document.getElementById('flExitBtn');
  btn.textContent=hardcore?'Hold to end session':stopwatch?'Stop stopwatch':'End session';
  document.getElementById('flExitProgress').style.width='0%';
  document.getElementById('focusLock').classList.add('active');
  document.body.style.overflow='hidden';
  tickFocus();
  focusState.interval=setInterval(tickFocus,1000);
}
function tickFocus(){
  if(!focusState) return;
  if(focusState.stopwatch){ focusState.elapsed++; const mm=String(Math.floor(focusState.elapsed/60)).padStart(2,'0'),ss=String(focusState.elapsed%60).padStart(2,'0'); document.getElementById('flTimer').textContent=`${mm}:${ss}`; return; }
  focusState.elapsed=Math.min(focusState.elapsed+1,focusState.totalSecs);
  const left=focusState.totalSecs-focusState.elapsed, mm=String(Math.floor(left/60)).padStart(2,'0'), ss=String(left%60).padStart(2,'0');
  document.getElementById('flTimer').textContent=`${mm}:${ss}`;
  document.getElementById('flProgressBar').style.width=`${(focusState.elapsed/focusState.totalSecs*100).toFixed(1)}%`;
  if(left<=0){ clearInterval(focusState.interval); document.getElementById('flTimer').textContent='00:00'; document.getElementById('flDone').style.display='block'; try{new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play();}catch(e){} }
}
function exitFocusLock(){
  if(!focusState) return;
  const wasStopwatch=focusState.stopwatch, elapsed=focusState.elapsed, task=focusState.task;
  clearInterval(focusState.interval); focusState=null;
  document.getElementById('focusLock').classList.remove('active');
  document.body.style.overflow='';
  document.getElementById('flExitProgress').style.width='0%';
  document.getElementById('flExitBtn').style.color='';
  document.getElementById('flProgress').style.visibility='visible';
  if(wasStopwatch&&elapsed>0){ const mm=String(Math.floor(elapsed/60)).padStart(2,'0'),ss=String(elapsed%60).padStart(2,'0'),roundedMins=Math.round(elapsed/60); let msg=`Stopwatch: ${mm}:${ss} ⏱`; if(task&&roundedMins>0&&task.estMinutes){ const liveTask=DB.tasks.find(t=>t.id===task.id); if(liveTask){ liveTask.estMinutes=Math.max(0,liveTask.estMinutes-roundedMins); save(); msg+=liveTask.estMinutes>0?` · ${liveTask.estMinutes}m left`:' · estimate cleared'; } } toast(msg); }
}
(function setupFlExit(){
  const btn=document.getElementById('flExitBtn'), bar=document.getElementById('flExitProgress');
  let holdRaf=null, holdStart=null;
  const HOLD_MS=2000;
  function startHold(){ if(!focusState||!focusState.hardcore) return; holdStart=Date.now(); (function tick(){ const prog=Math.min(1,(Date.now()-holdStart)/HOLD_MS); bar.style.width=(prog*100)+'%'; btn.style.color=`rgba(255,92,114,${0.4+prog*0.6})`; if(prog<1){holdRaf=requestAnimationFrame(tick);}else{exitFocusLock();} })(); }
  function cancelHold(){ cancelAnimationFrame(holdRaf); holdRaf=null; holdStart=null; bar.style.width='0%'; btn.style.color=''; }
  btn.addEventListener('pointerdown',startHold); btn.addEventListener('pointerup',cancelHold); btn.addEventListener('pointerleave',cancelHold); btn.addEventListener('pointercancel',cancelHold);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  btn.addEventListener('click',()=>{ if(focusState&&!focusState.hardcore) exitFocusLock(); });
})();

const _origToast=toast;
window.toast=function(msg){ if(!focusState) _origToast(msg); };

// Decide which tab to open: URL hash (#tasks) wins, then last-used tab, then dashboard.
const _validTabs = TABS.map(t=>t.id);
function _tabFromHash(){ return (location.hash||'').replace('#','').replace(/[^a-z]/gi,'').toLowerCase(); }
const _hashTab = _tabFromHash();
const _lastTab = (()=>{try{return localStorage.getItem('lifeflow.lastTab');}catch(e){return null;}})();
const _startTab = _validTabs.includes(_hashTab) ? _hashTab
                : (_validTabs.includes(_lastTab) ? _lastTab : 'dashboard');
// If the app is already open and a shortcut points it at #tasks, switch tabs live.
window.addEventListener('hashchange',()=>{ const h=_tabFromHash(); if(_validTabs.includes(h)) go(h); });
applyTheme(); renderNav(); go(_startTab);
</script>
