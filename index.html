<style>
/* === DESIGN TOKENS === */
:root{
  --bg:#0D0E10; --bg2:#16181C; --surface:#1C1E24; --surface2:#272A31;
  --border:rgba(255,255,255,.10); --border-hi:rgba(255,255,255,.16); --text:#F4F6F2; --muted:#A6ACA6;
  --accent:#17A883; --accent2:#3FD6A8; --accent-ink:#ffffff; --amber:#FFB570;
  /* priority ramp 1..5  (shared with the light theme — leave as-is) */
  --p1:#7EE7C7; --p2:#5BB8FF; --p3:#FFC857; --p4:#FF8F4D; --p5:#FF5C72;
  --danger:#FF5C72; --ring:rgba(23,168,131,.40);
  --accent-grad:linear-gradient(135deg,#17A883 0%,#1FC698 60%,#3FD6A8 100%);
  --card-grad:linear-gradient(162deg,rgba(255,255,255,.045),rgba(255,255,255,0) 46%);
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);
  --shadow-md:0 6px 18px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.04) inset;
  --shadow-lg:0 18px 44px rgba(0,0,0,.42),0 1px 0 rgba(255,255,255,.05) inset;
  --glow-accent:0 6px 20px rgba(23,168,131,.35);
}
html:not(.dark){
  --bg:#EAEBEF; --bg2:#FFFFFF; --surface:rgba(255,255,255,.82); --surface2:rgba(17,17,24,.055);
  --border:rgba(17,17,24,.10); --border-hi:rgba(17,17,24,.07); --text:#0A0A0E; --muted:#52525B;
  --accent:#138A6C; --accent2:#1FB389; --accent-ink:#ffffff; --ring:rgba(19,138,108,.28);
  --accent-grad:linear-gradient(135deg,#138A6C 0%,#17A883 100%);
  --card-grad:linear-gradient(162deg,rgba(255,255,255,.6),rgba(255,255,255,.15) 60%);
  --shadow-sm:0 1px 2px rgba(17,17,24,.06);
  --shadow-md:0 8px 24px rgba(17,17,24,.10);
  --shadow-lg:0 20px 48px rgba(17,17,24,.16);
  --glow-accent:0 8px 22px rgba(19,138,108,.22);
}
*{ -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
input, textarea{ -webkit-user-select:text; user-select:text; }
.card{ touch-action:manipulation; }
html{ background:var(--bg); min-height:100%; }
body{
  min-height:100vh;
  background:
    radial-gradient(1200px 760px at 112% -12%, color-mix(in srgb,var(--accent) 16%,transparent), transparent 58%),
    radial-gradient(960px 620px at -12% 2%, color-mix(in srgb,var(--amber) 9%,transparent), transparent 54%),
    radial-gradient(700px 500px at 50% 120%, color-mix(in srgb,var(--accent2) 8%,transparent), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text); font-family:'Hanken Grotesk',sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
.font-display{ font-family:'Bricolage Grotesque',sans-serif; letter-spacing:-.025em; }
.font-display.text-2xl, .font-display.text-3xl, .font-display.text-4xl{ letter-spacing:-.035em; }
.muted{ color:var(--muted); }
/* card: subtle gradient sheen + layered depth; translucent blur in light mode */
.card{ background:var(--surface); background-image:var(--card-grad); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow-md); position:relative; transition:transform .18s cubic-bezier(.22,1,.36,1), box-shadow .18s ease, border-color .18s ease; }
html:not(.dark) .card{ backdrop-filter:blur(10px) saturate(1.2); }
@media(hover:hover){ .card:hover{ border-color:var(--border-hi); } }
.soft{ background:var(--surface); border:1px solid var(--border); border-radius:16px; }
.btn{ border-radius:14px; font-weight:600; transition:transform .08s ease, box-shadow .18s ease, filter .15s ease, opacity .15s; }
.btn:active{ transform:scale(.96); }
.btn-accent{ background:var(--accent-grad); color:var(--accent-ink); box-shadow:var(--glow-accent); }
@media(hover:hover){ .btn-accent:hover{ filter:brightness(1.06); box-shadow:0 8px 26px rgba(23,168,131,.45); } }
.btn-ghost{ background:var(--surface2); color:var(--text); border:1px solid var(--border); }
@media(hover:hover){ .btn-ghost:hover{ border-color:var(--border-hi); } }
.chip{ border:1px solid var(--border); background:var(--surface); border-radius:999px; }
.input{ background:var(--surface); border:1px solid var(--border); border-radius:14px; color:var(--text); transition:border-color .15s ease, box-shadow .15s ease; min-height:50px; }
textarea.input{ min-height:0; }
.input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--ring); }
/* gradient accent for key headings */
.grad-accent{ background:var(--accent-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
/* desktop hover lift for cards & tappable cards */
@media(hover:hover){
  button.card:hover, a.card:hover, .card[data-nav]:hover, .card[data-open-task]:hover, .card[data-open-countdown]:hover, .card[data-friend-uid]:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); }
}
/* inner list rows → distinct, tappable tiles */
.tile{ background:var(--surface2); border:1px solid transparent; border-radius:12px; transition:transform .12s ease, border-color .15s ease, background .15s ease; }
.tile:active{ transform:scale(.985); }
@media(hover:hover){ .tile:hover{ border-color:var(--border-hi); background:color-mix(in srgb,var(--surface2) 70%,var(--surface)); } }
/* progress-ring glow */
.ring-glow circle:last-child{ filter:drop-shadow(0 0 5px color-mix(in srgb,var(--accent) 55%,transparent)); }
/* clearer active tab indicator on bottom nav */
#bottomnav .nav-item{ position:relative; }
#bottomnav .nav-item.active::before{ content:''; position:absolute; top:-2px; left:50%; transform:translateX(-50%); width:22px; height:3px; border-radius:0 0 4px 4px; background:var(--accent-grad); box-shadow:0 2px 8px rgba(23,168,131,.5); }
.nav-item.active{ color:var(--accent); }
.nav-item.active .nav-ico{ background:color-mix(in srgb,var(--accent) 16%,transparent); box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent), 0 4px 14px rgba(23,168,131,.22); }
::-webkit-scrollbar{ width:10px;height:10px } ::-webkit-scrollbar-thumb{ background:var(--border);border-radius:99px }
.fade-in{ animation:fade .35s ease both } @keyframes fade{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.stagger>*{ animation:fade .4s ease both } .stagger>*:nth-child(2){animation-delay:.04s}
.stagger>*:nth-child(3){animation-delay:.08s} .stagger>*:nth-child(4){animation-delay:.12s}
.stagger>*:nth-child(5){animation-delay:.16s} .stagger>*:nth-child(6){animation-delay:.2s}
.ring-prog{ transform:rotate(-90deg) }
.modal-back{ background:rgba(0,0,0,.55); backdrop-filter:blur(8px) saturate(1.1); -webkit-backdrop-filter:blur(8px) saturate(1.1) }
.sheet{ background:var(--bg2); background-image:var(--card-grad); border:1px solid var(--border-hi); box-shadow:var(--shadow-lg) }
@keyframes sheet-in{ from{opacity:0;transform:translateY(16px) scale(.985)} to{opacity:1;transform:none} }
.sheet{ animation:sheet-in .26s cubic-bezier(.22,1,.36,1) both }
.dragging{ opacity:.4 } .drop-hint{ outline:2px dashed var(--accent); outline-offset:2px }

.rd-placed{animation:rd-placed .55s cubic-bezier(.22,1,.36,1) forwards;border-radius:20px}
@keyframes rd-up{from{opacity:.55;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rd-dn{from{opacity:.55;transform:translateY(-10px)}to{opacity:1;transform:none}}

.rd-moved-dn{animation:rd-dn .28s cubic-bezier(.22,1,.36,1) forwards}
/* notification badge */
.notif-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;background:var(--danger);border-radius:999px;font-size:10px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg);pointer-events:none;z-index:1}

/* Stop native date/time inputs overflowing their box on iOS Safari, and keep a consistent height even when empty */
input[type="date"], input[type="time"], input[type="datetime-local"]{ -webkit-appearance:none; appearance:none; width:100%; max-width:100%; min-width:0; box-sizing:border-box; font-size:16px; line-height:1.5; min-height:50px; }

@keyframes fl-breathe{ 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.15);opacity:1} }

.fiery-text{ background:linear-gradient(45deg,#FF4500,#FFB020,#FF6A00,#FF3B30);-webkit-background-clip:text;background-clip:text;color:transparent;animation:flicker 1.8s ease-in-out infinite; }

<script>
/* ============================================================
   === DATA LAYER ===  (localStorage)
============================================================ */
const KEY = 'lifeflow.v2';
const uid = () => Math.random().toString(36).slice(2,9);
const todayStr = (d=new Date()) => { const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const esc = s => (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function nextHours(h){ return new Date(Date.now()+h*3600000).toISOString(); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); d.setHours(9,0,0,0); return d.toISOString(); }
function mkHist(daysAgo){ const h={}; daysAgo.forEach(n=>{ const d=new Date(); d.setDate(d.getDate()-n); h[todayStr(d)]='done'; }); return h; }
function mkStreak(n){ const h={}; for(let i=1;i<=n+2;i++){ const d=new Date(); d.setDate(d.getDate()-i); h[todayStr(d)]='done'; } return h; }
function mkMixed(done=[],skip=[],excuse=[]){ const h={}; const set=(a,s)=>a.forEach(n=>{ const d=new Date(); d.setDate(d.getDate()-n); h[todayStr(d)]=s; }); set(done,'done'); set(skip,'skip'); set(excuse,'excuse'); return h; }

const DEFAULT = {
  settings:{ theme:'dark', energy:{} },
  dataVersion:1,

  routines:[],

  tasks:[],

  countdowns:[],

  shopping:[],

  reviews:[],
  focusSessions:[],
  firstRun:true,
};
let DB = load();
function load(){
  try{
    const r=localStorage.getItem(KEY);
    const d=r?JSON.parse(r):structuredClone(DEFAULT);
    // v1 migration: wipe demo data on existing installs
    if(!d.dataVersion){
      d.routines=[];
      d.tasks=[];
      d.countdowns=[];
      d.shopping=[];
      d.reviews=[];
      d.dataVersion=1;
      localStorage.setItem(KEY, JSON.stringify(d));
    }
    (d.routines||[]).forEach((r,i)=>{ if(r.order===undefined) r.order=i; });
    return d;
  }catch(e){ return structuredClone(DEFAULT); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); if(typeof FB_READY!=='undefined' && FB_READY && currentUser) syncStreaks(); }

/* ============================================================
   === FIREBASE CONFIG — fill this in to enable Friends ===
   Steps:
   1. Go to https://console.firebase.google.com
   2. Create project → Add web app → copy the config object below
   3. Authentication → Sign-in method → Enable "Email/Password"
   4. Firestore Database → Create database (production mode)
   5. Firestore → Rules → paste the rules shown in the comment below
============================================================ */
const FB_CONFIG = {
  apiKey:            "AIzaSyCggBKyGMsbhaNTO_l5IBy-jhuTr_EvFRM",
  authDomain:        "lifeflow-83511.firebaseapp.com",
  projectId:         "lifeflow-83511",
  storageBucket:     "lifeflow-83511.firebasestorage.app",
  messagingSenderId: "860874594770",
  appId:             "1:860874594770:web:1260fbd0df8813798f500b"
};
/*
  Firestore security rules (Firebase Console → Firestore → Rules tab):
  ─────────────────────────────────────────────────────────────────────
  rules_version = '2';
  service cloud.firestore {
    match /databases/{database}/documents {
      match /users/{uid} {
        allow read:  if request.auth != null;
        allow write: if request.auth.uid == uid;
        match /connections/{fid} {
          allow read, write: if request.auth.uid == uid;
        }
      }
      match /codes/{code} { allow read, write: if request.auth != null; }
      match /nudges/{nid}  { allow read, write: if request.auth != null; }
      match /sharedRoutines/{rid} { allow read, write: if request.auth != null; }
      match /users/{uid}/notifications/{nid} { allow read, write: if request.auth != null; }
    }
  }
  ─────────────────────────────────────────────────────────────────────
*/
const FB_READY = (typeof firebase !== 'undefined') && FB_CONFIG.apiKey !== 'YOUR_API_KEY';

// ── Push notifications ──────────────────────────────────────────────────────
// Get this from: Firebase Console → Project Settings → Cloud Messaging
// → Web Push certificates → Generate key pair → copy the key
const VAPID_KEY = 'BJ_trBclO414afQ5SHZPPzo0nxDt6ONcB8FMgMiNNsBqHcM7iU-iTbKlnRFjY1lFh81a1SHIZBNp_8MG8twjOO8';
// ────────────────────────────────────────────────────────────────────────────

let fbAuth = null, fbDb = null, currentUser = null;
let friendsCache = { me:null, friends:[], ts:0, _loading:false };
let _leaderboard = []; // last-rendered leaderboard for stats modal lookups
const FRIENDS_TTL = 30000;

if(FB_READY){
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    fbAuth = firebase.auth();
    fbDb   = firebase.firestore();
    fbAuth.onAuthStateChanged(async user => {
      currentUser = user;
      friendsCache = { me:null, friends:[], ts:0, _loading:false };
      if(current === 'friends') render();
      if(user){
        await ensureUserProfile(user);
        if(current === 'friends') render();
        checkNudges(); loadNotifications(); syncSharedRoutines();
        loadFriendsData().then(()=>{ if(current === 'friends') render(); });
        // Set up push notifications (delayed so SW registration is ready)
        setTimeout(() => setupFCM(user), 2500);
      }
    });
  }catch(e){ console.error('Firebase init error:', e); }
}

async function setupFCM(user) {
  if(!FB_READY || !fbDb || !user) return false;
  if(!('Notification' in window)) { toast('Notifications not supported on this browser'); return false; }
  const _isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if(_isIOS) { toast('Push notifications aren\'t supported on iOS — this is a Safari limitation'); return false; }
  if(Notification.permission === 'denied') { toast('Notifications blocked — go to Settings › Safari › LifeFlow to allow'); return false; }
  if(!VAPID_KEY || VAPID_KEY === 'YOUR_VAPID_KEY_HERE') return false;
  try {
    const permission = await Notification.requestPermission();
    if(permission !== 'granted') { toast('Notification permission not granted'); return false; }
    const fbMsg = firebase.messaging();
    const tokenOpts = { vapidKey: VAPID_KEY };
    if(window._swReg) tokenOpts.serviceWorkerRegistration = window._swReg;
    const token = await fbMsg.getToken(tokenOpts);
    if(token) {
      await fbDb.doc(`users/${user.uid}`).update({ fcmToken: token });
      return true;
    } else {
      toast('Could not get notification token — try again');
      return false;
    }
  } catch(e) {
    console.error('FCM setup error:', e);
    toast('Notification setup failed: ' + e.message);
    return false;
  }
}

/* ============================================================
   === NAV CONFIG & ROUTER ===
============================================================ */
const TABS = [
  { id:'dashboard', label:'Home', ico:dashIco() },
  { id:'routines',  label:'Routines', ico:routIco() },
  { id:'tasks',     label:'Tasks', ico:taskIco() },
  { id:'countdowns',label:'Events', ico:eventIco() },
  { id:'shopping',  label:'Shop', ico:shopIco() },
  { id:'friends',   label:'Friends', ico:friendsIco() },
];
let current = 'dashboard';

/* ============================================================
   === FRIENDS VIEW ===
============================================================ */
function renderFriends(){
  if(!FB_READY) return `
    <div class="max-w-lg mx-auto pt-6 stagger">
      <h2 class="font-display font-extrabold text-2xl mb-1">Friends</h2>
      <p class="muted text-sm mb-6">Streak leaderboard &amp; nudges</p>
      <div class="card p-7 text-center space-y-3">
        <div class="text-4xl">🔌</div>
        <div class="font-display font-bold text-lg">Firebase not configured yet</div>
        <p class="muted text-sm leading-relaxed">Open <code style="background:var(--surface2);padding:2px 8px;border-radius:6px;font-size:12px">index.html</code> in a text editor and fill in your Firebase config to enable friends, leaderboards, and nudges.</p>
        <a href="https://console.firebase.google.com" target="_blank" rel="noopener" class="btn btn-accent px-5 py-3 block text-sm font-semibold">Open Firebase Console ↗</a>
        <p class="text-xs muted">Free Spark plan is more than enough.</p>
      </div>
    </div>`;

  if(!currentUser) return `
    <div class="max-w-lg mx-auto pt-6 stagger">
      <h2 class="font-display font-extrabold text-2xl mb-1">Friends</h2>
      <p class="muted text-sm mb-6">Streak leaderboard &amp; nudges</p>
      <div class="card p-7 text-center space-y-4">
        <div class="w-16 h-16 rounded-3xl grid place-items-center mx-auto text-3xl" style="background:var(--surface2)">👥</div>
        <div class="font-display font-bold text-xl">Join the leaderboard</div>
        <p class="muted text-sm leading-relaxed">Sign in to share your routine streaks with friends, climb the leaderboard, and send motivational nudges.</p>
        <div class="flex gap-3 justify-center pt-1">
          <button data-act="fb-signin" class="btn btn-accent px-5 py-3 text-sm">Sign In</button>
          <button data-act="fb-signup" class="btn btn-ghost px-5 py-3 text-sm">Create Account</button>
        </div>
      </div>
    </div>`;

  const stale = Date.now() - friendsCache.ts > FRIENDS_TTL;
  if(stale && !friendsCache._loading) loadFriendsData();
  if(!friendsCache.ts) return `<div class="flex items-center justify-center py-24"><div class="muted text-sm">Loading friends…</div></div>`;

  const me = friendsCache.me || {};
  const myStreaks = (me.streaks || computeStreaksForSync()).filter(s=>s.streak>0).sort((a,b)=>b.streak-a.streak);
  const myTotal   = me.totalStreak ?? myStreaks.reduce((s,r)=>s+r.streak,0);

  const everyone = [
    { uid:currentUser.uid, username:me.username||currentUser.displayName||'You', totalStreak:myTotal, streaks:myStreaks, avatar:me.avatar, status:me.status, avatarImg:me.avatarImg, isMe:true },
    ...friendsCache.friends.map(f=>({...f, streaks:(f.streaks||[]).filter(s=>s.streak>0).sort((a,b)=>b.streak-a.streak)}))
  ].sort((a,b)=>b.totalStreak-a.totalStreak);

  _leaderboard = everyone;
  const rankLabel = ['🥇','🥈','🥉'];
  const rows = everyone.map((p,i)=>{
    const rank = i<3 ? rankLabel[i] : `<span class="text-sm muted">#${i+1}</span>`;
    const init = (p.username||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const hasPhoto = !!p.avatarImg;
    const avatarBg = hasPhoto ? 'transparent' : (p.avatar?.color||(p.isMe?'var(--accent)':'var(--surface2)'));
    const avatarInner = hasPhoto
      ? `<img src="${p.avatarImg}" style="width:100%;height:100%;object-fit:cover">`
      : `<span style="color:${p.isMe?'var(--accent-ink)':'var(--text)'}">${init}</span>`;
    const topRoutes = (p.streaks||[]).slice(0,3).map(r=>`${esc(r.title)}: ${r.streak}🔥`).join(' · ');
    const subLine = p.status ? esc(p.status) : (topRoutes||'No streaks yet');
    const _nh=new Date().getHours();
    const _nc=_nh<12?'#16A34A':_nh<18?'#D97706':'#DC2626';
    const nudge = !p.isMe ? `<button data-nudge="${p.uid}" class="btn flex-none px-3 py-2 text-xs font-bold" style="background:${_nc};color:#fff;border-radius:10px" title="Nudge ${esc(p.username)}">Nudge</button>` : '';
    return `<div class="card p-4 flex items-center gap-3" data-friend-uid="${p.uid}" style="cursor:pointer">
      <div class="font-display font-bold w-7 text-center flex-none text-base">${rank}</div>
      <div class="w-10 h-10 rounded-xl grid place-items-center font-display font-bold text-sm flex-none overflow-hidden" style="background:${avatarBg};">${avatarInner}</div>
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-sm truncate">${esc(p.username)}${p.isMe?' <span class="muted text-xs font-normal">(You)</span>':''}</div>
        <div class="muted text-xs truncate">${subLine}</div>
      </div>
      <div class="font-display font-bold text-xl flex-none">${p.totalStreak} <span class="text-base">🔥</span></div>
      ${nudge}
    </div>`;
  }).join('');

/* ============================================================
   === URGENCY ENGINE ===  (time left + est. effort + importance)
============================================================ */
function urgency(t){
  const imp = t.importance||1;
  if(!t.deadline) return Math.round(imp*8 + 6);            // no deadline → low/moderate
  const hoursLeft = (new Date(t.deadline)-Date.now())/3600000;
  const estH = (t.estMinutes||30)/60;
  const slack = hoursLeft - estH;                          // free hours after doing it
  let timeFactor;
  if(slack<=0) timeFactor=1;                               // no breathing room
  else timeFactor = Math.max(0, 1 - slack/(24*7));         // ramps up across a week
  let score = timeFactor*70 + (imp/5)*30;
  if(hoursLeft<0) score += 15;                             // overdue boost
  return Math.round(Math.max(0,Math.min(100,score)));
}
function isOverdue(t){ return t.deadline && new Date(t.deadline)<new Date() && !t.done; }
function urgColor(s){ return s>=80?'--p5':s>=60?'--p4':s>=40?'--p3':s>=20?'--p2':'--p1'; }
function fmtDue(iso){
  if(!iso) return 'No deadline';
  const d=new Date(iso), now=new Date(), diff=(d-now)/3600000;
  const day=d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const tm=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  if(diff<0) return `Overdue · ${day}`;
  if(diff<24) return `Today ${tm}`;
  if(diff<48) return `Tomorrow ${tm}`;
  return `${day} ${tm}`;
}

/* ============================================================
   === STREAK ENGINE ===  (skip preserves, miss breaks)
============================================================ */
const DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];
function scheduledOn(r,d){ return !!(r.schedule && r.schedule.days && r.schedule.days.includes(d.getDay())); }
function streakOf(r){
  // strict (default): any missed/skipped scheduled day ends the streak
  // lenient: two consecutive missed/skipped days end it; one is bridged
  // excuse: neutral — doesn't count toward streak but doesn't break it either
  const mode = DB.settings.streakMode || 'strict';
  let streak=0, consecutive_misses=0;
  const today=new Date(); today.setHours(12,0,0,0);
  for(let i=0;i<500;i++){
    const d=new Date(today); d.setDate(today.getDate()-i);
    if(r.createdAt && d < new Date(r.createdAt)) break; // don't count days before creation
    if(!scheduledOn(r,d)) continue;
    const ds=todayStr(d), s=r.history&&r.history[ds];
    const isToday = i===0;
    if(s==='done'){ streak++; consecutive_misses=0; }
    else if(s==='excuse'){ /* excused miss — transparent, no increment, no break */ }
    else if(isToday){ /* grace — day isn't over yet, don't penalise */ }
    else if(mode==='strict'){ break; }
    else { consecutive_misses++; if(consecutive_misses>=2) break; }
  }
  return streak;
}
function doneCount(r){ return Object.values(r.history).filter(v=>v==='done').length; }
function longestStreakOf(r){
  // Scan up to 2 years of history chronologically and find the longest consecutive run
  const today=new Date(); today.setHours(12,0,0,0);
  let longest=0, cur=0;
  for(let i=729;i>=0;i--){
    const d=new Date(today); d.setDate(today.getDate()-i);
    if(r.createdAt && d < new Date(r.createdAt)) continue; // skip days before creation
    if(!scheduledOn(r,d)) continue;
    const s=r.history[todayStr(d)];
    if(s==='done'){ cur++; if(cur>longest) longest=cur; }
    else if(s==='excuse'){ /* transparent — skip without breaking */ }
    else { cur=0; }
  }
  return longest;
}

/* interpolate a colour from green→red by fraction t (0..1) */
function lerpColor(a,b,t){ t=Math.max(0,Math.min(1,t));
  const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16);
  const r=Math.round((A>>16)+(((B>>16)-(A>>16))*t));
  const g=Math.round(((A>>8)&255)+((((B>>8)&255)-((A>>8)&255))*t));
  const c=Math.round((A&255)+(((B&255)-(A&255))*t));
  return `rgb(${r},${g},${c})`;
}
/* steady multi-stop gradient (no muddy middle): pass hex stops + t (0..1) */
function lerpMulti(stops,t){ t=Math.max(0,Math.min(1,t));
  const seg=1/(stops.length-1), i=Math.min(stops.length-2,Math.floor(t/seg));
  return lerpColor(stops[i],stops[i+1],(t-i*seg)/seg);
}

/* streak length ending on a given date — excuse is neutral */
function streakAsOf(r,date){
  const mode = DB.settings.streakMode || 'strict';
  let streak=0, consecutive_misses=0;
  const d=new Date(date); d.setHours(12,0,0,0);
  for(let i=0;i<500;i++){

    if(!scheduledOn(r,dd)) continue;

    else if(s==='excuse'){ /* neutral */ }

  }

}
/* gauge data for an event — normalise everything to midnight so elapsed = daysSinceStart / totalDays */
function eventGauge(c){
  const now=new Date(); now.setHours(0,0,0,0);
  const start=new Date(c.startedAt||c.createdAt||now.getTime()); start.setHours(0,0,0,0);
  const end=new Date(c.date); end.setHours(0,0,0,0);
  const totalMs=Math.max(86400000, end-start);   // at least 1 day
  const elapsedMs=Math.max(0, now-start);
  const elapsed=Math.min(1, elapsedMs/totalMs);
  const d=Math.round((end-now)/86400000);         // signed days remaining
  return { d, elapsed, color:lerpMulti(['#16A34A','#22C55E','#84CC16','#EAB308','#D97706','#F97316','#EA580C','#DC2626'],elapsed) };
}

  if(s==='partial') return '#FFC857';                     // partial (waiting for group) = amber
  if(s==='done'){
    if(!sched) return '#FFC857';                          // bonus day = yellow

  const close = DB.countdowns.map(c=>({...c,d:daysLeft(c.date)})).filter(c=>c.d>=0).sort((a,b)=>a.d-b.d).slice(0,3);

  // ── today-at-a-glance metrics ──
  const isToday = iso => iso && todayStr(new Date(iso))===todayStr();
  const overdue   = DB.tasks.filter(t=>!t.done && isOverdue(t));
  const dueToday  = DB.tasks.filter(t=>!t.done && isToday(t.deadline));
  const dueTodayAll = DB.tasks.filter(t=>isToday(t.deadline));
  const dueTodayDone = dueTodayAll.filter(t=>t.done).length;
  const dayTotal = todays.length + dueTodayAll.length;
  const dayDone  = doneToday + dueTodayDone;
  const pct = dayTotal ? Math.round(dayDone/dayTotal*100) : 0;
  const nextEvent = close[0];

  // ── progress ring ──
  const R=30, C=2*Math.PI*R;
  const ring = `<div class="relative shrink-0" style="width:76px;height:76px">
    <svg width="76" height="76" class="ring-prog ${pct>0?'ring-glow':''}"><circle cx="38" cy="38" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="6"/>
      <circle cx="38" cy="38" r="${R}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" style="transition:stroke-dashoffset .6s ease"/></svg>
    <div class="absolute inset-0 grid place-items-center">
      ${dayTotal===0?mi(ICON.spark,22):`<span class="font-display font-extrabold text-lg" style="color:var(--accent)">${pct}<span class="text-xs">%</span></span>`}
    </div></div>`;

  // ── contextual subline ──
  let sub, subColor='var(--accent)';
  if(dayTotal===0){ sub='Nothing scheduled today — an open canvas.'; subColor='var(--muted)'; }
  else if(dayDone>=dayTotal){ sub="Everything's done for today. Nice work."; }
  else { const left=dayTotal-dayDone; sub=`${left} thing${left>1?'s':''} left on your plate today`; subColor='var(--muted)'; }

  // ── stat helper ──
  const stat=(label,val,danger)=>`<div class="card p-3 text-center">
    <div class="font-display font-extrabold text-2xl" style="color:${danger?'var(--danger)':'var(--text)'}">${val}</div>
    <div class="text-[11px] muted mt-0.5">${label}</div></div>`;

  return `
  <div class="stagger space-y-5 md:space-y-6 max-w-2xl">

    <!-- Hero (greeting + quote connected) -->
    <section class="card p-5 relative overflow-hidden" style="background:linear-gradient(135deg, color-mix(in srgb,var(--accent) 10%,var(--surface)), var(--surface))">
      <div class="flex items-center justify-between gap-4">
        <div class="min-w-0">
          <h2 class="font-display text-2xl md:text-3xl font-extrabold leading-tight">${name}</h2>
          <p class="muted text-sm">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</p>
          <p class="text-sm font-medium mt-2.5" style="color:${subColor}">${sub}</p>
        </div>
        ${ring}
      </div>
      <div class="mt-4 pt-4" style="border-top:1px solid var(--border)">
        <p class="text-sm leading-relaxed" style="font-style:italic"><span class="font-display" style="color:var(--accent);font-size:22px;line-height:.8;vertical-align:-.15em">&ldquo;</span>&nbsp; ${esc(getDailyQuote())} &nbsp;<span class="font-display" style="color:var(--accent);font-size:22px;line-height:.8;vertical-align:-.15em">&rdquo;</span></p>
      </div>
    </section>

    <!-- Overdue tasks box -->
    <button data-nav="tasks" class="card p-4 w-full text-left flex items-center gap-3" ${overdue.length?'style="border-color:color-mix(in srgb,var(--danger) 40%,var(--border))"':''}>
      <span class="w-10 h-10 rounded-xl grid place-items-center shrink-0 font-display font-extrabold text-lg" style="background:color-mix(in srgb,${overdue.length?'var(--danger)':'var(--accent)'} 16%,transparent);color:${overdue.length?'var(--danger)':'var(--accent)'}">${overdue.length}</span>
      <span class="flex-1 min-w-0">
        <span class="text-sm font-semibold block" style="${overdue.length?'color:var(--danger)':''}">${overdue.length?`Overdue task${overdue.length>1?'s':''}`:'No overdue tasks'}</span>
        <span class="text-xs muted truncate block">${overdue.length?esc(overdue.slice().sort((a,b)=>new Date(a.deadline)-new Date(b.deadline))[0].title)+(overdue.length>1?` +${overdue.length-1} more`:''):'You\'re all caught up'}</span>
      </span>
      <span class="muted">→</span>
    </button>

    <!-- Next event with completion wheel -->
    ${nextEvent?(()=>{ const ne=eventGauge(nextEvent); const r2=27, c2=2*Math.PI*r2;
      return `<button data-open-countdown="${nextEvent.id}" class="card p-4 w-full text-left flex items-center gap-4">
        <div class="relative shrink-0" style="width:66px;height:66px">
          <svg width="66" height="66" class="ring-prog"><circle cx="33" cy="33" r="${r2}" fill="none" stroke="var(--surface2)" stroke-width="5"/>
            <circle cx="33" cy="33" r="${r2}" fill="none" stroke="${ne.color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c2}" stroke-dashoffset="${c2*(1-ne.elapsed)}"/></svg>
          <div class="absolute inset-0 grid place-items-center font-display font-extrabold ${ne.d>99?'text-base':'text-xl'}" style="color:${ne.color}">${ne.d}</div>
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-[11px] muted uppercase tracking-wide">Next event</div>
          <div class="font-display font-bold text-lg truncate">${esc(nextEvent.title)}</div>
          <div class="text-xs muted">${ne.d===0?'Today!':ne.d===1?'Tomorrow':ne.d+' days left'} · ${new Date(nextEvent.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</div>
        </div>
      </button>`; })():''}

    <!-- Routines today -->
    <section class="card p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-display font-bold text-lg">Today's routines</h3>
        <span class="text-xs muted">${doneToday}/${todays.length} done</span>
      </div>
      ${todays.length? `<div class="space-y-2">${todays.slice(0,4).map(routineRow).join('')}</div>${todays.length>4?`<p class="text-xs muted text-center mt-2"><button data-nav="routines" style="color:var(--accent)">+${todays.length-4} more</button></p>`:''}`
        : `<p class="muted text-sm">No routines scheduled today. <button data-nav="routines" class="underline" style="color:var(--accent)">Add one</button></p>`}
    </section>

    <div class="grid md:grid-cols-2 gap-5">
      <!-- Urgent tasks -->
      <section class="card p-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-display font-bold text-lg">Most urgent</h3>
          <button data-nav="tasks" class="text-xs" style="color:var(--accent)">All tasks →</button>
        </div>
        ${urgent.length? `<div class="space-y-2">${urgent.map(miniTask).join('')}</div>`
          : `<p class="muted text-sm">No open tasks. Nice. 🎉</p>`}
      </section>

      <!-- Closest countdowns -->
      <section class="card p-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-display font-bold text-lg">Coming up</h3>
          <button data-nav="countdowns" class="text-xs" style="color:var(--accent)">All events →</button>
        </div>
        ${close.length? `<div class="space-y-2">${close.map(miniCountdown).join('')}</div>`
          : `<p class="muted text-sm">No upcoming events.</p>`}
      </section>
    </div>

    <button data-act="insights" class="btn btn-accent w-full py-4 font-display font-bold inline-flex items-center justify-center gap-2">${mi(ICON.chart,18)} Weekly Insights</button>
  </div>`;
}
function greeting(){ const h=new Date().getHours(); return h<5?'Late night':h<12?'Good morning':h<18?'Good afternoon':'Good evening'; }
function routineRow(r){
  const done = r.history[todayStr()]==='done';
  const st = streakOf(r);
  return `<div class="tile flex items-center gap-3 p-2">
    <button data-routine-toggle="${r.id}" class="w-7 h-7 rounded-lg grid place-items-center shrink-0 btn"
      style="${done?'background:var(--accent);color:var(--accent-ink)':'border:1.5px solid var(--border)'}">${done?'✓':''}</button>
    <span class="text-sm flex-1 ${done?'line-done':''}">${routineIcon(r,15)} ${esc(r.title)}</span>
    ${st>0?`<span class="text-xs font-bold flame inline-flex items-center gap-0.5" style="color:var(--p4)">${mi(ICON.flame,14)}${st}</span>`:''}
  </div>`;
}
function miniTask(t){
  const c=`var(${urgColor(t.u)})`;
  return `<button data-open-task="${t.id}" class="tile w-full text-left flex items-center gap-3 p-2">
    <span class="w-9 h-9 rounded-lg grid place-items-center text-xs font-bold shrink-0" style="background:color-mix(in srgb,${c} 22%,transparent);color:${c}">${t.u}</span>
    <span class="flex-1 min-w-0"><span class="text-sm font-medium block truncate">${esc(t.title)}</span>
      <span class="text-xs ${isOverdue(t)?'':'muted'}" style="${isOverdue(t)?'color:var(--danger)':''}">${fmtDue(t.deadline)}</span></span>
  </button>`;
}
function miniCountdown(c){
  const d=c.d, g=eventGauge(c);
  return `<button data-open-countdown="${c.id}" class="tile w-full text-left flex items-center gap-3 p-2">
    <span class="w-10 h-10 rounded-xl grid place-items-center shrink-0 font-display font-extrabold" style="background:color-mix(in srgb,${g.color} 22%,transparent);color:${g.color}">${d}</span>
    <span class="flex-1 min-w-0"><span class="text-sm font-medium block truncate">${esc(c.title)}</span>
      <span class="text-xs muted">${d===0?'Today!':d===1?'Tomorrow':d+' days left'}</span></span>
  </button>`;
}
function daysLeft(iso){ const d=new Date(iso); d.setHours(0,0,0,0); const n=new Date(); n.setHours(0,0,0,0); return Math.round((d-n)/86400000); }

============================================================ */
function renderRoutines(){
  const totalDone = DB.routines.reduce((a,r)=>a+doneCount(r),0);
  return `
  <div class="max-w-2xl space-y-5">
    <div class="flex items-center justify-between">
      <div><h2 class="font-display text-2xl font-extrabold">Routines</h2><p class="muted text-sm">${totalDone} completion${totalDone===1?'':'s'} logged</p></div>
      <div class="flex gap-2">
        <button data-act="routine-reorder" class="btn btn-ghost px-3 py-2.5 text-sm inline-flex items-center gap-1.5" style="${routineReorder?'background:var(--accent);color:var(--accent-ink)':''}">${routineReorder?'':(mi('<path d="M3 6h18M3 12h18M3 18h18"/>',15)+' ')}${routineReorder?'Done':'Reorder'}</button>
        <button data-act="add-shared-routine" class="btn btn-ghost px-3 py-2.5 text-sm inline-flex items-center gap-1.5" title="Create group routine">${mi('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',16)}</button>
        <button data-act="add-routine" class="btn btn-accent px-4 py-2.5 text-sm">＋ New</button>
      </div>
    </div>
    <div id="routineList" class="${routineReorder?'':'stagger '}space-y-3">
      ${DB.routines.length?[...DB.routines].sort((a,b)=>{ const ra=routineRank(a),rb=routineRank(b); return ra!==rb?ra-rb:(a.order??0)-(b.order??0); }).map(routineCard).join(''):emptyState('No routines yet','Build a rhythm for the things you want to do regularly.')}
    </div>
    ${DB.routines.length?`<p class="text-xs muted text-center">Swipe a routine right to complete, short left to excuse, full left to miss.</p>`:''}
  </div>`;
}
function routineCard(r){
  const today=todayStr();
  const partial=r.history[today]==='partial';
  const st=streakOf(r), done=r.history[today]==='done', skipped=r.history[today]==='skip', excused=r.history[today]==='excuse';
  const schedToday=scheduledOn(r,new Date());
  const bonusDone = done && !schedToday;
  const sched = r.schedule.days.length===7?'Every day':r.schedule.days.map(d=>DOW[d]).join(' ');
  const lbl=['Su','Mo','Tu','We','Th','Fr','Sa'];
  const cells=[]; const d=new Date();
  for(let i=6;i>=0;i--){ const dd=new Date(); dd.setDate(d.getDate()-i);
    const col=dayCellColor(r,dd);
    cells.push(`<div class="flex flex-col items-center gap-1">
      <span style="width:18px;height:18px;border-radius:5px;background:${col};border:1px solid var(--border)"></span>
      <span class="text-[9px] muted">${lbl[dd.getDay()]}</span></div>`);
  }
  const sc = streakColor(st);
  const fiery = st>=100;
  const nextMs = MILESTONES.find(x=>x>st);
  const msHint = fiery ? `<div class="text-[10px] mt-0.5 font-semibold" style="color:${FIERY}">🔥 on fire</div>`
    : (st>0 && nextMs) ? `<div class="text-[10px] muted mt-0.5 whitespace-nowrap">${nextMs-st} to ${nextMs}</div>` : '';
  const btnStyle = done
    ? (bonusDone?'background:#FFC857;color:#1a1200':'background:var(--accent);color:var(--accent-ink)')
    : partial ? 'background:#FFC857;color:#1a1200'
    : excused ? 'background:color-mix(in srgb,#7B9EC8 22%,transparent);color:#7B9EC8;border:1.5px solid rgba(123,158,200,.4)'
    : skipped ? 'background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger)'
    : 'border:1.5px solid var(--border)';
  const dim = !schedToday && !done && !partial && !skipped && !excused;
  const toggleIcon = done||partial ? '✓' : excused ? '—' : routineIcon(r,18);
  const streakEl = st>0
    ? `<button data-streak-cal="${r.id}" class="font-display font-extrabold inline-flex items-center gap-1 ${fiery?'fiery-text text-2xl':'text-lg'}" style="${fiery?'':'color:'+sc};cursor:pointer">${mi(ICON.flame,fiery?22:18)}${st}</button>`
    : `<button data-streak-cal="${r.id}" class="text-xs muted" style="cursor:pointer">no streak</button>`;
  // shared: waiting text
  const members = r.sharedMembers||[];
  const todayCompletions = (r.sharedCompletions||{})[today]||{};
  const waiting = partial ? members.filter(m=>!todayCompletions[m.uid]&&(!currentUser||m.uid!==currentUser.uid)).map(m=>m.username) : [];
  const waitingText = waiting.length ? ` · ⏳ ${waiting.slice(0,2).map(n=>n.split(' ')[0]).join(', ')}…` : '';
  const subtitle = partial ? waitingText
    : skipped?' · missed today':excused?' · excused today':!schedToday?' · not scheduled today':'';
  // group badge + member avatars for shared routines
  const borderColor = fiery ? FIERY : r.isShared ? '#A78BFA' : sc;
  const groupBadge = r.isShared ? `<span class="text-[9px] font-bold chip px-1.5 py-0.5 ml-1.5 inline-flex items-center gap-0.5" style="background:color-mix(in srgb,#A78BFA 18%,transparent);color:#A78BFA;border-color:rgba(167,139,250,.3)">${mi('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',10)}Group</span>` : '';
  const memberAvatars = r.isShared && members.length>0
    ? `<div style="position:absolute;bottom:${routineReorder?'34px':'10px'};left:14px;display:flex;gap:3px;align-items:center">
        ${members.map(m=>{const init=(m.username||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();const mc=!!todayCompletions[m.uid];return `<span title="${esc(m.username||'Member')}" style="width:20px;height:20px;border-radius:6px;background:${mc?'var(--accent)':'var(--surface2)'};border:1.5px solid ${mc?'var(--accent)':'var(--border)'};display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:${mc?'white':'var(--muted)'}">${init}</span>`;}).join('')}
        ${(r.sharedPending||[]).length?`<span class="text-[9px] muted">+${r.sharedPending.length}</span>`:''}
      </div>`
    : '';
  const pbClass = r.isShared ? 'pb-11' : 'pb-9';
  return `<div class="routine-row" data-routine-id="${r.id}" style="position:relative;overflow:hidden;border-radius:20px">
    <div data-swipe-bg="${r.id}" style="position:absolute;inset:0;display:flex;align-items:center;padding:0 24px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;border-radius:20px"></div>
    <div data-swipe-fg="${r.id}" data-swipe-kind="routine" class="p-4 ${pbClass} ${fiery?'fiery-ring':''}" style="position:relative;background:var(--bg2);border:1px solid var(--border);border-left:4px solid ${borderColor};border-radius:20px;touch-action:pan-y;will-change:transform;${dim?'opacity:.55':''}">
      <div class="flex items-start gap-3">
        <button data-routine-toggle="${r.id}" class="w-9 h-9 rounded-xl grid place-items-center shrink-0 btn" style="${btnStyle}">${toggleIcon}</button>
        <div class="flex-1 min-w-0">
          <div class="font-semibold inline-flex items-center flex-wrap gap-1 ${done?'line-done':''}">${esc(r.title)}${groupBadge}</div>
          <div class="text-xs muted mt-0.5">${sched}${subtitle}</div>
          <button data-streak-cal="${r.id}" class="flex gap-2 mt-2.5" style="cursor:pointer">${cells.join('')}</button>
        </div>
        <div class="text-right shrink-0">
          ${streakEl}
          ${msHint}
        </div>
      </div>
      ${routineReorder?`<div style="position:absolute;bottom:8px;left:12px;display:flex;gap:5px"><button data-routine-up="${r.id}" class="chip px-2 py-1 text-xs inline-flex items-center" title="Move up">${mi('<path d="M18 15l-6-6-6 6"/>',13)}</button><button data-routine-down="${r.id}" class="chip px-2 py-1 text-xs inline-flex items-center" title="Move down">${mi('<path d="M6 9l6 6 6-6"/>',13)}</button></div>`:''}
      ${memberAvatars}
      <button data-routine-edit="${r.id}" class="text-[11px] chip px-2 py-1" style="position:absolute;bottom:10px;right:14px">${r.isShared?'edit group':'edit'}</button>
    </div>
  </div>`;
}
function badgeList(){ return []; }

/* ============================================================
   === VIEW: TASKS ===  (list + Eisenhower matrix)
============================================================ */
let routineReorder=false;
let taskView='list', taskSort=DB.settings.taskSort||'urgency';
function renderTasks(){
  const open = DB.tasks.filter(t=>!t.done && !t.deletedAt);
  const sorters = { urgency:(a,b)=>urgency(b)-urgency(a), priority:(a,b)=>b.importance-a.importance,
    deadline:(a,b)=>(new Date(a.deadline||8e15))-(new Date(b.deadline||8e15)), manual:()=>0 };
  const sorted=[...open].sort(sorters[taskSort]);
  const done    = DB.tasks.filter(t=> t.done && !t.deletedAt).sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
  const deleted = DB.tasks.filter(t=>t.deletedAt).sort((a,b)=>b.deletedAt-a.deletedAt);
  const swipeRow=(t,kind)=>`
    <div style="position:relative;overflow:hidden;border-radius:14px">
      <div data-swipe-bg="${t.id}" style="position:absolute;inset:0;display:flex;align-items:center;padding:0 20px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;border-radius:14px"></div>
      <div data-swipe-fg="${t.id}" data-swipe-kind="${kind}" class="flex items-center gap-2 text-sm px-2 py-1.5" style="position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:14px;touch-action:pan-y;will-change:transform">
        ${kind==='task-deleted'
          ? `<button data-task-restore="${t.id}" class="w-5 h-5 rounded grid place-items-center shrink-0 text-xs font-bold" style="background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)">✕</button>`
          : `<button data-task-toggle="${t.id}" class="w-5 h-5 rounded grid place-items-center shrink-0" style="background:var(--accent-grad);color:var(--accent-ink);box-shadow:var(--glow-accent)">✓</button>`}
        <span class="line-done flex-1">${esc(t.title)}</span>
        ${kind==='task-deleted'
          ? `<button data-task-restore="${t.id}" class="chip px-2 py-1 text-xs shrink-0" style="color:var(--accent)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg></button>`
          : `<button data-task-toggle="${t.id}" class="chip px-2 py-1 text-xs shrink-0" style="color:var(--accent)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg></button>`}
        <button data-task-del="${t.id}" class="muted text-xs shrink-0">✕</button>
      </div>
    </div>`;
  return `
  <div class="max-w-2xl space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="font-display text-2xl font-extrabold">Tasks</h2>
      <button data-act="add-task" class="btn btn-accent px-4 py-2.5 text-sm">＋ New</button>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <div class="chip p-1 flex text-xs font-semibold">
        <button data-tview="list" class="px-3 py-1.5 rounded-full" style="${taskView==='list'?'background:var(--accent);color:var(--accent-ink)':''}">List</button>
        <button data-tview="matrix" class="px-3 py-1.5 rounded-full" style="${taskView==='matrix'?'background:var(--accent);color:var(--accent-ink)':''}">Matrix</button>
      </div>
      ${taskView==='list'?`<select id="taskSort" class="input text-xs px-3 py-2 font-semibold" style="border-radius:999px">
        <option value="urgency" ${taskSort==='urgency'?'selected':''}>AI urgency</option>
        <option value="priority" ${taskSort==='priority'?'selected':''}>Priority</option>
        <option value="deadline" ${taskSort==='deadline'?'selected':''}>Deadline</option>
        <option value="manual" ${taskSort==='manual'?'selected':''}>Manual order</option>
      </select>`:''}
    </div>

    ${taskView==='list'

    ${done.length?`<details class="card p-4"><summary class="cursor-pointer text-sm font-semibold muted">Completed (${done.length})</summary>
      <div class="space-y-2 mt-3">${done.map(t=>swipeRow(t,'task')).join('')}</div>

    </details>`:''}
  </div>`;
}
function taskCard(t){
  const u=urgency(t), c=`var(${urgColor(u)})`, pc=`var(--p${t.importance})`;
  const od=isOverdue(t);
  if(!t.subtasks) t.subtasks=[];
  const subDone=t.subtasks.filter(s=>s.done).length;
  const borderCol = t.tags?.length ? tagColor(t.tags[0]) : pc;
  const inner=`<div class="p-3.5" style="border-left:4px solid ${borderCol};border-radius:20px">
    <div class="flex items-start gap-3">
      <div class="flex-1 min-w-0" data-open-task="${t.id}">
        <div class="flex items-center gap-2">
          <span class="font-semibold" style="${od?'color:var(--danger)':''}">${esc(t.title)}</span>${t.recur?`<span class="px-1.5 py-0.5 rounded text-[10px] font-bold" style="background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)" title="${t.recur}">↻ ${t.recur}</span>`:''}
        </div>
        <div class="flex items-center gap-2 mt-1.5 flex-wrap text-[11px]">
          <span class="px-2 py-0.5 rounded-md font-bold" style="background:color-mix(in srgb,${c} 20%,transparent);color:${c}">⚡${u}</span>
          <span class="px-2 py-0.5 rounded-md font-semibold" style="background:color-mix(in srgb,${pc} 18%,transparent);color:${pc}">P${t.importance}</span>
          <span class="muted" style="${od?'color:var(--danger)':''}">${fmtDue(t.deadline)}</span>
          ${t.estMinutes?`<span class="muted">· ~${t.estMinutes}m</span>`:''}
          ${t.subtasks.length?`<span class="muted">· ${subDone}/${t.subtasks.length} sub</span>`:''}
        </div>
        ${t.tags?.length?`<div class="flex gap-1 mt-2 flex-wrap">
          ${(t.tags||[]).map(x=>`<span class="chip px-2 py-0.5 text-[10px] font-semibold" style="background:color-mix(in srgb,${tagColor(x)} 20%,transparent);color:${tagColor(x)};border-color:${tagColor(x)}">${esc(x)}</span>`).join('')}
        </div>`:''}
      </div>
      <button data-pomo="${t.id}" title="Focus on this" class="shrink-0 btn muted" style="padding:2px">${mi(ICON.timer,20)}</button>
    </div></div>`;
  return `<div class="swipe-row" data-task-card="${t.id}" ${taskSort==='manual'?'draggable="true"':''} style="position:relative;overflow:hidden;border-radius:20px">
    <div data-swipe-bg="${t.id}" style="position:absolute;inset:0;display:flex;align-items:center;padding:0 24px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;border-radius:20px"></div>
    <div data-swipe-fg="${t.id}" data-swipe-kind="task" style="position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:20px;touch-action:pan-y;will-change:transform">${inner}</div>
  </div>`;
}
function matrixView(open){
  const q=[[],[],[],[]]; // 0:do now(urgent+imp) 1:schedule(imp) 2:delegate(urgent) 3:later
  open.forEach(t=>{ const u=urgency(t)>=55, imp=t.importance>=4;
    q[u&&imp?0:!u&&imp?1:u&&!imp?2:3].push(t); });
  const titles=[mi(ICON.flame,14)+' Do now',mi(ICON.cal,14)+' Schedule',mi(ICON.bolt,14)+' Quick / delegate',mi(ICON.moon,14)+' Later'];
  const cols=['--p5','--p2','--p4','--p1'];
  return `<div class="grid grid-cols-2 gap-3">${q.map((items,i)=>`
    <div class="card p-3 min-h-32" style="border-top:3px solid var(${cols[i]})">
      <div class="text-xs font-bold mb-2 inline-flex items-center gap-1.5" style="color:var(${cols[i]})">${titles[i]}</div>
      <div class="space-y-1.5">${items.map(t=>`<button data-open-task="${t.id}" class="w-full text-left text-xs p-2 rounded-lg" style="background:var(--surface)"><div class="font-semibold truncate" style="color:var(--p${t.importance})">${esc(t.title)}</div>${t.deadline?`<div class="mt-0.5 muted truncate" style="${isOverdue(t)?'color:var(--danger)':''}">${fmtDue(t.deadline)}</div>`:''}</button>`).join('')||'<span class="text-[11px] muted">—</span>'}</div>
    </div>`).join('')}</div>`;
}

function renderCountdowns(){

  const before = DB.countdowns.length;
  DB.countdowns = DB.countdowns.filter(c => daysLeft(c.date) >= 0);
  if(DB.countdowns.length !== before) save();
  const list = DB.countdowns.map(c=>({...c,d:daysLeft(c.date)})).sort((a,b)=>a.d-b.d);
  return `

function countdownCard(c){
  const g=eventGauge(c), d=g.d, col=g.color;
  const R=26, C=2*Math.PI*R;
  const label = d===0?'Today! 🎉':d===1?'Tomorrow':`${d} days left`;
  return `<div class="card p-4 flex items-center gap-4">
    <div class="relative w-16 h-16 shrink-0">
      <svg width="64" height="64" class="ring-prog"><circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="5"/>
        <circle cx="32" cy="32" r="${R}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-g.elapsed)}"/></svg>
      <div class="absolute inset-0 grid place-items-center font-display font-extrabold text-xl" style="color:${col}">${d}</div>
    </div>
    <div class="min-w-0 flex-1">

  </div>`;
}

        ${custom.map(c=>customTagBtn(c.name,(e.tags||[]).includes(c.name))).join('')}
        <button type="button" id="openAddTag" class="chip px-2.5 py-1.5 text-xs" style="border-style:dashed">＋ Tag</button>
      </div>
      <div id="addTagForm" style="display:none" class="mt-2 p-3 rounded-xl space-y-2" style="background:var(--surface2)">
        <input id="newTagName" placeholder="Tag name" class="input w-full px-3 py-2 text-sm">
        <div class="flex flex-wrap gap-1.5" id="palettePicker">${TAG_PALETTE.map(col=>`<button type="button" data-pal="${col}" class="pal-btn w-7 h-7 rounded-full" style="background:${col}"></button>`).join('')}</div>
        <div class="flex gap-2"><button type="button" id="cancelAddTag" class="btn btn-ghost flex-1 py-2 text-sm">Cancel</button><button type="button" id="confirmAddTag" class="btn btn-accent flex-1 py-2 text-sm font-bold">Add tag</button></div>
      </div>
      <div id="delTagConfirm" style="display:none" class="mt-2 p-3 rounded-xl" style="background:color-mix(in srgb,var(--danger) 12%,var(--surface))">
        <p id="delTagMsg" class="text-sm font-semibold mb-2" style="color:var(--danger)"></p>
        <div class="flex gap-2"><button type="button" id="keepTag" class="btn btn-ghost flex-1 py-2 text-sm">Keep</button><button type="button" id="deleteTag" class="btn flex-1 py-2 text-sm font-bold" style="background:var(--danger);color:#fff">Delete</button></div>
      </div>
    </div>
    <div id="subWrap"><div class="text-xs muted mb-1">Subtasks</div><div id="subs" class="space-y-1.5">${(e.subtasks||[]).map(subInput).join('')}</div>
      <button type="button" id="addSub" class="text-xs mt-1" style="color:var(--accent)">＋ add subtask</button></div>
    <div class="flex gap-2 pt-2">
      ${t?`<button type="button" data-task-del="${e.id}" class="btn btn-ghost px-4 py-3" style="color:var(--danger)">Delete</button>`:''}
      <button type="button" id="tSave" class="btn btn-accent flex-1 py-3 font-bold">${t?'Save':'Add task'}</button>
    </div>
  </div>`);

  let imp=e.importance||3, tags=[...(e.tags||[])], energy=[...(e.energy||[])];
  let pendingDelTag=null, newTagColor=TAG_PALETTE[0];
  const m=document.getElementById('modal');

  // importance
  m.querySelectorAll('[data-imp]').forEach(b=>b.onclick=()=>{ imp=+b.dataset.imp; m.querySelectorAll('.imp-btn').forEach(x=>{const i=+x.dataset.imp;x.style.cssText=i===imp?`background:var(--p${i});color:var(--accent-ink)`:'background:var(--surface2)';});});

  // tag toggle (built-in + custom)
  function refreshTagBtns(){
    m.querySelectorAll('[data-tag]').forEach(b=>{
      const name=b.dataset.tag, col=tagColor(name), on=tags.includes(name);
      const btn=b.classList.contains('tag-btn')?b:null; if(!btn) return;
      // find parent span or is the button itself
      const host=b.parentElement.classList.contains('chip')?b.parentElement:b;
      host.style.background=on?col:'transparent';
      host.style.color=on?'#fff':col;
    });
  }
  m.addEventListener('click',ev=>{
    const tagBtn=ev.target.closest('[data-tag]');
    if(tagBtn && tagBtn.dataset.tag!==undefined && !ev.target.closest('[data-del-custom-tag]')){
      const name=tagBtn.dataset.tag; tags.includes(name)?tags=tags.filter(x=>x!==name):tags.push(name); refreshTagBtns(); return;
    }
    const delBtn=ev.target.closest('[data-del-custom-tag]');
    if(delBtn){
      pendingDelTag=delBtn.dataset.delCustomTag;
      m.querySelector('#delTagMsg').textContent=`Delete "${pendingDelTag}" from all tasks?`;
      m.querySelector('#delTagConfirm').style.display='block';
      m.querySelector('#addTagForm').style.display='none';
    }
  });

  // add-tag form
  m.querySelector('#openAddTag').onclick=()=>{ m.querySelector('#addTagForm').style.display='block'; m.querySelector('#delTagConfirm').style.display='none'; m.querySelector('#newTagName').focus(); };
  m.querySelector('#cancelAddTag').onclick=()=>{ m.querySelector('#addTagForm').style.display='none'; };
  // palette picker
  const paintPal=()=>m.querySelectorAll('.pal-btn').forEach(b=>{ b.style.boxShadow=b.dataset.pal===newTagColor?'0 0 0 3px #fff,0 0 0 5px '+b.dataset.pal:'none'; });
  paintPal();
  m.querySelectorAll('.pal-btn').forEach(b=>b.onclick=()=>{ newTagColor=b.dataset.pal; paintPal(); });
  m.querySelector('#confirmAddTag').onclick=()=>{
    const name=m.querySelector('#newTagName').value.trim(); if(!name) return;
    if(!(DB.settings.customTags||[]).find(x=>x.name===name)){
      if(!DB.settings.customTags) DB.settings.customTags=[];
      DB.settings.customTags.push({name,color:newTagColor});
      save();
    }
    tags.push(name);
    // rebuild tag row
    const row=m.querySelector('#tagRow');
    const addBtn=m.querySelector('#openAddTag');
    const newCustom=DB.settings.customTags||[];
    row.innerHTML=TAGS.map(x=>tagBtn(x,tags.includes(x))).join('')+newCustom.map(c=>customTagBtn(c.name,tags.includes(c.name))).join('');
    row.appendChild(addBtn);
    m.querySelector('#addTagForm').style.display='none';
    m.querySelector('#newTagName').value='';
    // re-bind tag clicks
    m.querySelectorAll('[data-tag]').forEach(b=>b.onclick=ev=>{
      if(ev.target.closest('[data-del-custom-tag]')) return;
      const nm=b.dataset.tag; tags.includes(nm)?tags=tags.filter(x=>x!==nm):tags.push(nm); refreshTagBtns();
    });
  };
  // delete tag confirmation
  m.querySelector('#keepTag').onclick=()=>{ m.querySelector('#delTagConfirm').style.display='none'; pendingDelTag=null; };
  m.querySelector('#deleteTag').onclick=()=>{
    if(!pendingDelTag) return;
    DB.settings.customTags=(DB.settings.customTags||[]).filter(x=>x.name!==pendingDelTag);
    DB.tasks.forEach(task=>{ task.tags=(task.tags||[]).filter(x=>x!==pendingDelTag); });
    tags=tags.filter(x=>x!==pendingDelTag);
    save();
    m.querySelector('#delTagConfirm').style.display='none';
    // rebuild tag row
    const row=m.querySelector('#tagRow');
    const addBtn=m.querySelector('#openAddTag');
    const newCustom=DB.settings.customTags||[];
    row.innerHTML=TAGS.map(x=>tagBtn(x,tags.includes(x))).join('')+newCustom.map(c=>customTagBtn(c.name,tags.includes(c.name))).join('');
    row.appendChild(addBtn);
    pendingDelTag=null;
  };

  m.querySelector('#addSub').onclick=()=>{ m.querySelector('#subs').insertAdjacentHTML('beforeend', subInput({id:uid(),title:'',done:false})); };
  m.querySelector('#subs').addEventListener('click',ev=>{ if(ev.target.dataset.subdel!==undefined) ev.target.closest('.subrow').remove(); });

  // save
  m.querySelector('#tSave').onclick=()=>{
    const title=m.querySelector('#tTitle').value.trim(); if(!title){ toast('Please add a task name'); m.querySelector('#tTitle').focus(); return; }
    const deadlineVal=m.querySelector('#tDeadline').value;
    const subs=[...m.querySelectorAll('.subrow')].map(r=>({id:r.dataset.sid,title:r.querySelector('input[type=text]').value.trim(),done:r.querySelector('input[type=checkbox]').checked})).filter(s=>s.title);
    const recurVal=m.querySelector('#tRecur').value||null;
    const data={ title, deadline:deadlineVal?new Date(deadlineVal).toISOString():null, estMinutes:+m.querySelector('#tEst').value||30, importance:imp, tags, energy, location:e.location||'', subtasks:subs, recur:recurVal };
    if(t){ Object.assign(t,data); } else { DB.tasks.push({ id:uid(), ...data, done:false, createdAt:Date.now(), order:DB.tasks.length }); }
    save(); closeModal(); render();
  };
}
function subInput(s){ return `<div class="subrow flex items-center gap-2" data-sid="${s.id}"><input type="checkbox" ${s.done?'checked':''} class="w-4 h-4 accent-current"><input type="text" value="${esc(s.title)}" placeholder="Subtask" class="input flex-1 px-3 py-1.5 text-sm"><button type="button" data-subdel class="muted">✕</button></div>`; }
function toLocalInput(iso){ const d=new Date(iso); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }

function openTask(id){ const t=DB.tasks.find(x=>x.id===id); if(t) taskModal(t); }

/* === STREAK CALENDAR === full month view of a routine's history */
let _calRoutine=null, _calDate=null;
function streakCalendarModal(id){ _calRoutine=id; _calDate=new Date(); _calDate.setDate(1); renderStreakCal(); }
function renderStreakCal(){
  const r=DB.routines.find(x=>x.id===_calRoutine); if(!r) return;
  const y=_calDate.getFullYear(), m=_calDate.getMonth();
  const startDow=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const monthName=new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const dows=['Su','Mo','Tu','We','Th','Fr','Sa'];
  const todayS=todayStr();
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div></div>';
  for(let day=1;day<=daysInMonth;day++){
    const dd=new Date(y,m,day), ds=todayStr(dd), col=dayCellColor(r,dd);
    const filled = col!=='transparent' && col!=='var(--surface2)';
    const bg = col==='transparent' ? 'var(--surface)' : col;
    const txt = filled ? '#08090C' : 'var(--muted)';
    const ring = ds===todayS ? 'box-shadow:0 0 0 2px var(--text)' : '';
    cells+=`<div class="aspect-square rounded-lg grid place-items-center text-xs font-semibold" style="background:${bg};color:${txt};${ring}">${day}</div>`;
  }
  openModal(`
    <div class="flex items-center justify-between mb-1"><h3 class="font-display font-bold text-xl truncate pr-2">${routineIcon(r,18)} ${esc(r.title)}</h3><button data-close class="muted text-xl">✕</button></div>
    <div class="inline-flex items-center gap-1.5 text-sm mb-4" style="color:var(--p4)">${mi(ICON.flame,15)}<span class="font-bold">${streakOf(r)}</span> <span class="muted">day streak</span></div>
    <div class="flex items-center justify-between mb-3">
      <button data-cal-prev class="chip px-3 py-1.5">‹</button>
      <div class="font-semibold">${monthName}</div>
      <button data-cal-next class="chip px-3 py-1.5">›</button>
    </div>
    <div class="grid grid-cols-7 gap-1.5 mb-1.5">${dows.map(x=>`<div class="text-center text-[10px] muted">${x}</div>`).join('')}</div>
    <div class="grid grid-cols-7 gap-1.5">${cells}</div>
    <div class="flex flex-wrap gap-x-4 gap-y-2 mt-4 text-[11px] muted">
      <span class="inline-flex items-center gap-1.5"><span style="width:12px;height:12px;border-radius:3px;background:var(--accent)"></span>Done</span>
      <span class="inline-flex items-center gap-1.5"><span style="width:12px;height:12px;border-radius:3px;background:var(--danger)"></span>Missed</span>
      <span class="inline-flex items-center gap-1.5"><span style="width:12px;height:12px;border-radius:3px;background:#7B9EC8"></span>Excused</span>
      <span class="inline-flex items-center gap-1.5"><span style="width:12px;height:12px;border-radius:3px;background:#FFC857"></span>Bonus day</span>
    </div>`);
  const mEl=document.getElementById('modal');
  mEl.querySelector('[data-cal-prev]').onclick=()=>{ _calDate.setMonth(_calDate.getMonth()-1); renderStreakCal(); };
  mEl.querySelector('[data-cal-next]').onclick=()=>{ const n=new Date(_calDate); n.setMonth(n.getMonth()+1); if(n<=new Date()){ _calDate=n; renderStreakCal(); } };
}

/* === COUNTDOWN MODAL === */
function countdownModal(c){
  const e=c||{};
  openModal(`
  <div class="flex items-center justify-between mb-4"><h3 class="font-display font-bold text-xl">${c?'Edit event':'New event'}</h3><button data-close class="muted text-xl">✕</button></div>
  <div class="space-y-3">
    <input id="cTitle" value="${esc(e.title||'')}" placeholder="Event name" class="input w-full px-4 py-3 font-medium">
    <label class="text-xs muted block min-w-0">Date<input id="cDate" type="date" value="${e.date?e.date.slice(0,10):''}" class="input w-full px-4 py-3 mt-1 min-w-0" style="box-sizing:border-box"></label>
    <div class="flex gap-2 pt-2">${c?`<button type="button" data-countdown-del="${e.id}" class="btn btn-ghost px-4 py-3" style="color:var(--danger)">Delete</button>`:''}<button type="button" id="cSave" class="btn btn-accent flex-1 py-3 font-bold">${c?'Save':'Add event'}</button></div>
  </div>`);
  const m=document.getElementById('modal');
  m.querySelector('#cSave').onclick=()=>{
    const title=m.querySelector('#cTitle').value.trim();
    const dateVal=m.querySelector('#cDate').value;
    if(!title){ toast('Please add an event name'); m.querySelector('#cTitle').focus(); return; }
    if(!dateVal){ toast('Please pick a date'); return; }
    const date=new Date(dateVal+'T09:00').toISOString();
    if(c){
      // Keep startedAt (the day tracking began); updating date changes total = elapsed days + new remaining days
      const startedAt = c.startedAt || c.createdAt || Date.now();
      Object.assign(c,{title,date,startedAt});
    } else {
      DB.countdowns.push({id:uid(),title,date,createdAt:Date.now(),startedAt:Date.now()});
    }
    save(); closeModal(); render(); if(!c) window.scrollTo(0,0);
  };
}
function openCountdown(id){ const c=DB.countdowns.find(x=>x.id===id); if(c) countdownModal(c); }

  </form>`);
  let force='auto'; const m=document.getElementById('modal'); const ta=m.querySelector('textarea');
  const guess=m.querySelector('#guess');
  const updateGuess=()=>{ const r=classify(ta.value); guess.textContent = ta.value.trim()? `→ looks like a ${force==='auto'?r.type:force}`:''; };

function routeFor(t){ return {task:'tasks',routine:'routines',shopping:'shopping',countdown:'countdowns'}[t]; }
// crude but useful classifier
function classify(raw){
  const s=raw.toLowerCase();
  if(/\b(buy|need|grocery|groceries|shop|purchase|pick up)\b|^\s*-?\s*(milk|eggs|bread)/.test(s)) return {type:'shopping'};
  if(/\b(every ?day|daily|each day|every (mon|tue|wed|thu|fri|sat|sun)|weekday|weekly|routine)\b/.test(s)) return {type:'routine', days:parseDays(s)};
  if(/\b(birthday|anniversary|countdown|in \d+ days?|on (jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec))\b/.test(s)) return {type:'countdown', date:parseDate(s)};
  if(/\b(idea|note|remember|thought|don't forget|reminder to self)\b|^idea:/.test(s)) return {type:'note'};
  return {type:'task', deadline:parseDate(s), importance:/!|important|urgent|asap/.test(s)?5:3};
}
function parseDays(s){ const map={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6}; const d=[]; for(const k in map) if(s.includes(k))d.push(map[k]); if(/every ?day|daily/.test(s))return[0,1,2,3,4,5,6]; if(/weekday/.test(s))return[1,2,3,4,5]; return d.length?d:[0,1,2,3,4,5,6]; }
function parseDate(s){
  const now=new Date();
  let m=s.match(/in (\d+) days?/); if(m){const d=new Date();d.setDate(d.getDate()+ +m[1]);d.setHours(9,0,0,0);return d.toISOString();}
  if(/tomorrow/.test(s)){const d=new Date();d.setDate(d.getDate()+1);d.setHours(9,0,0,0);return d.toISOString();}
  if(/today|tonight/.test(s)){const d=new Date();d.setHours(20,0,0,0);return d.toISOString();}
  const wd=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  for(let i=0;i<7;i++){ if(s.includes(wd[i])){const d=new Date();let add=(i-d.getDay()+7)%7||7;d.setDate(d.getDate()+add);d.setHours(9,0,0,0);return d.toISOString();} }
  return null;
}
function cleanTitle(raw){ return raw.replace(/\b(every ?day|daily|weekday|weekly|in \d+ days?|tomorrow|today|tonight|!important|important|urgent|asap|buy|idea:)\b/gi,'').replace(/\s+/g,' ').trim()||raw; }
function addParsed(type,raw,meta){
  const title=cleanTitle(raw);
  if(type==='task') DB.tasks.push({id:uid(),title,deadline:meta.deadline||null,estMinutes:30,importance:meta.importance||3,tags:[],energy:[],location:'',subtasks:[],done:false,createdAt:Date.now(),order:DB.tasks.length});
  else if(type==='routine') DB.routines.push({id:uid(),title,icon:'spark',color:'#7EE7C7',schedule:{type:'weekly',days:meta.days||[0,1,2,3,4,5,6]},history:{},order:DB.routines.length,createdAt:Date.now()});
  else if(type==='shopping') DB.shopping.push({id:uid(),name:title,note:'',price:'',list:'need',done:false,createdAt:Date.now()});
  else if(type==='countdown') DB.countdowns.push({id:uid(),title,date:meta.date||addDays(7),color:'--p2',createdAt:Date.now(),startedAt:Date.now()});
  save();
}
function startVoice(ta,cb){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('Voice not supported on this browser'); return; }
  const rec=new SR(); rec.lang='en-US'; rec.interimResults=false;
  rec.onresult=e=>{ ta.value=(ta.value+' '+e.results[0][0].transcript).trim(); cb&&cb(); };
  rec.onerror=()=>toast('Mic error'); rec.start(); toast('Listening…');
}

function computeStreaksForSync(){
  return DB.routines
    .filter(r=>r.shareWithFriends!==false)
    .map(r=>({ id:r.id, title:r.title, icon:r.icon||'', streak:streakOf(r), longestStreak:longestStreakOf(r) }));
}

async function ensureUserProfile(user){
  if(!fbDb) return;
  const ref = fbDb.doc(`users/${user.uid}`);
  const snap = await ref.get();
  if(!snap.exists){
    const code = await generateFriendCode();
    const streaks = computeStreaksForSync();
    await ref.set({
      username: user.displayName||'LifeFlower',
      friendCode: code,
      streaks,
      totalStreak: streaks.reduce((s,r)=>s+r.streak,0),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await fbDb.doc(`codes/${code}`).set({ uid:user.uid });
  }
}

async function generateFriendCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code, exists=true;
  while(exists){
    code=Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
    const s=await fbDb.doc(`codes/${code}`).get(); exists=s.exists;
  }
  return code;
}

async function syncStreaks(){
  if(!fbDb||!currentUser) return;
  try{
    const streaks=computeStreaksForSync();
    const weekAgo=Date.now()-7*86400000;
    const tasksCompleted=DB.tasks.filter(t=>t.done&&!t.deletedAt).length;
    const tasksThisWeek=DB.tasks.filter(t=>t.done&&!t.deletedAt&&t.completedAt&&t.completedAt>weekAgo).length;
    const sessions=DB.focusSessions||[];
    const focusMinutesTotal=sessions.reduce((s,x)=>s+x.min,0);
    const focusMinutesWeek=sessions.filter(x=>x.ts>weekAgo).reduce((s,x)=>s+x.min,0);
    const focusSessionsWeek=sessions.filter(x=>x.ts>weekAgo).length;
    await fbDb.doc(`users/${currentUser.uid}`).update({
      streaks, totalStreak:streaks.reduce((s,r)=>s+r.streak,0),
      tasksCompleted, tasksThisWeek,
      focusMinutesTotal, focusMinutesWeek, focusSessionsWeek,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){}
}

async function loadFriendsData(){
  if(!fbDb||!currentUser||friendsCache._loading) return;
  friendsCache._loading=true;
  try{
    const mySnap=await fbDb.doc(`users/${currentUser.uid}`).get();
    // If doc doesn't exist or has no friend code, create/fix the profile
    if(!mySnap.exists||!mySnap.data()?.friendCode){
      await ensureUserProfile(currentUser);
      const fixed=await fbDb.doc(`users/${currentUser.uid}`).get();
      friendsCache.me=fixed.data();
    } else {
      friendsCache.me=mySnap.data();
    }
    const connSnap=await fbDb.collection(`users/${currentUser.uid}/connections`).get();
    const uids=connSnap.docs.map(d=>d.id);
    const profiles=await Promise.all(uids.map(uid=>fbDb.doc(`users/${uid}`).get()));
    friendsCache.friends=profiles.filter(d=>d.exists).map(d=>({uid:d.id,...d.data()}));
    friendsCache.ts=Date.now();
  }catch(e){ console.error('loadFriendsData:',e); }
  friendsCache._loading=false;
  if(current==='friends') render();
}

async function checkNudges(){
  if(!fbDb||!currentUser) return;
  try{
    const snap=await fbDb.collection('nudges').where('to','==',currentUser.uid).limit(10).get();
    const unread=snap.docs.filter(d=>!d.data().read);
    if(!unread.length) return;
    const n=unread[0].data();
    setTimeout(()=>toast(`🫸 ${n.fromName} nudged you — keep going!`),1500);
    const batch=fbDb.batch();
    unread.forEach(d=>batch.update(d.ref,{read:true}));
    await batch.commit();
  }catch(e){}
}

async function sendNudge(friendUid){
  if(!fbDb||!currentUser) return;
  const myName=friendsCache.me?.username||currentUser.displayName||'Someone';

function fbAddFriendModal(){
  openModal(`<div class="flex items-center justify-between mb-4"><h3 class="font-display font-bold text-xl">Add Friend</h3><button data-close class="muted text-xl">✕</button></div>
    <p class="muted text-sm mb-4">Ask your friend for their 6-character code from the Friends tab.</p>
    <div class="space-y-3">
      <input id="fbCode" type="text" maxlength="6" placeholder="ABCD12"
             class="input w-full px-4 py-4 font-mono font-bold uppercase tracking-widest text-center"
             style="font-size:22px;letter-spacing:.18em">
      <div id="fbCodeErr" class="text-xs" style="color:var(--danger)"></div>
      <button id="fbAddBtn" class="btn btn-accent w-full py-3 text-sm font-semibold">Add Friend</button>
    </div>`);
  const inp=document.getElementById('fbCode');
  inp.oninput=()=>{ inp.value=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,''); };
  inp.focus();
  document.getElementById('fbAddBtn').onclick=async()=>{
    const code=inp.value.trim().toUpperCase();
    const err=document.getElementById('fbCodeErr');
    if(code.length!==6){err.textContent='Code must be exactly 6 characters';return;}
    const btn=document.getElementById('fbAddBtn'); btn.disabled=true; btn.textContent='Adding…';
    try{
      const codeDoc=await fbDb.doc(`codes/${code}`).get();
      if(!codeDoc.exists){err.textContent='Code not found — double-check and try again';btn.disabled=false;btn.textContent='Add Friend';return;}
      const friendUid=codeDoc.data().uid;
      if(friendUid===currentUser.uid){err.textContent="That's your own code!";btn.disabled=false;btn.textContent='Add Friend';return;}
      // Already friends?
      const existing=await fbDb.doc(`users/${currentUser.uid}/connections/${friendUid}`).get();
      if(existing.exists){err.textContent='You\'re already friends!';btn.disabled=false;btn.textContent='Add Friend';return;}
      const friendDoc=await fbDb.doc(`users/${friendUid}`).get();
      if(!friendDoc.exists){err.textContent='User not found';btn.disabled=false;btn.textContent='Add Friend';return;}
      const fd=friendDoc.data();
      const myName=friendsCache.me?.username||currentUser.displayName||'Someone';
      // Having the code = consent, so connect both people instantly — no acceptance step
      const batch=fbDb.batch();
      batch.set(fbDb.doc(`users/${currentUser.uid}/connections/${friendUid}`),{username:fd.username||'Friend',addedAt:firebase.firestore.FieldValue.serverTimestamp()});
      batch.set(fbDb.doc(`users/${friendUid}/connections/${currentUser.uid}`),{username:myName,addedAt:firebase.firestore.FieldValue.serverTimestamp()});
      await batch.commit();
      friendsCache.ts=0; renderNav();
      closeModal(); toast(`You and ${fd.username} are now friends! 🎉`);
    }catch(e){ console.error(e); err.textContent='Error: '+e.message; btn.disabled=false; btn.textContent='Add Friend'; }
  };
}

async function acceptFriendRequest(notif){
  if(!fbDb||!currentUser) return;
  try{
    const friendDoc=await fbDb.doc(`users/${notif.fromUid}`).get();
    const fd=friendDoc.exists?friendDoc.data():{};
    const myName=friendsCache.me?.username||currentUser.displayName||'Friend';
    const batch=fbDb.batch();
    batch.set(fbDb.doc(`users/${currentUser.uid}/connections/${notif.fromUid}`),{username:notif.fromName||fd.username||'Friend',addedAt:firebase.firestore.FieldValue.serverTimestamp()});
    batch.set(fbDb.doc(`users/${notif.fromUid}/connections/${currentUser.uid}`),{username:myName,addedAt:firebase.firestore.FieldValue.serverTimestamp()});
    batch.update(fbDb.doc(`users/${currentUser.uid}/notifications/${notif._id}`),{status:'accepted'});
    await batch.commit();
    _notifications=_notifications.filter(n=>n._id!==notif._id);
    friendsCache.ts=0; renderNav();
    toast(`You and ${notif.fromName} are now friends! 🎉`);
    notificationsModal();
  }catch(e){ console.error(e); toast('Error accepting request'); }
}

async function declineFriendRequest(notif){

  }catch(e){}
}

  // For "me" use fresh local data; for friends use Firestore-synced snapshot
  let streaks, tasksCompleted, tasksThisWeek, focusMinutesTotal, focusMinutesWeek, focusSessionsWeek;
  if(person.isMe){
    streaks=DB.routines
      .filter(r=>r.shareWithFriends!==false)
      .map(r=>({id:r.id,title:r.title,icon:r.icon||'',streak:streakOf(r),longestStreak:longestStreakOf(r)}))
      .sort((a,b)=>b.streak-a.streak);
    const weekAgo=Date.now()-7*86400000;
    tasksCompleted=DB.tasks.filter(t=>t.done&&!t.deletedAt).length;
    tasksThisWeek=DB.tasks.filter(t=>t.done&&!t.deletedAt&&t.completedAt&&t.completedAt>weekAgo).length;
    const sessions=DB.focusSessions||[];
    focusMinutesTotal=sessions.reduce((s,x)=>s+x.min,0);
    focusMinutesWeek=sessions.filter(x=>x.ts>weekAgo).reduce((s,x)=>s+x.min,0);
    focusSessionsWeek=sessions.filter(x=>x.ts>weekAgo).length;
  } else {
    streaks=(person.streaks||[]).slice().sort((a,b)=>b.streak-a.streak);
    tasksCompleted=person.tasksCompleted;
    tasksThisWeek=person.tasksThisWeek;
    focusMinutesTotal=person.focusMinutesTotal;
    focusMinutesWeek=person.focusMinutesWeek;
    focusSessionsWeek=person.focusSessionsWeek;
  }

  const routineRows=streaks.map(s=>{

        <div class="text-[10px] muted">best ${best}</div>

  const noRoutines=streaks.length===0;
  const taskBlock=tasksCompleted!=null?`

      <div class="text-[11px] muted font-semibold uppercase tracking-wide mb-3">Tasks</div>

      </div>
    </div>`
    :`<p class="text-xs muted text-center mt-3">Task stats appear after ${esc(person.username)} next syncs</p>`;
  const fmtFocusHrs=m=>m>=60?`${(m/60).toFixed(1)}h`:`${m}m`;
  const focusBlock=focusMinutesTotal!=null?`
    <div class="card p-4 mt-3">
      <div class="text-[11px] muted font-semibold uppercase tracking-wide mb-3">Focus</div>

        <div><div class="font-display font-bold text-2xl">${focusSessionsWeek||0}</div><div class="text-xs muted">sessions</div></div>

  openModal(`
